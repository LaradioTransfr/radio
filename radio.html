<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRANSFR STUDIO - Interactive Network</title>
    <style>
        body { background-color: #0b0c10; color: #ffffff; font-family: sans-serif; margin: 0; padding: 0; }
        .BARRE-HAUT { background-color: #1f2833; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #66fcf1; }
        .TITRE-RADIO { font-size: 26px; font-weight: bold; letter-spacing: 1px; }
        .TITRE-RADIO span { color: #66fcf1; }
        .BOUTON-JAUNE-ADMIN { background-color: #ffcc00; color: #0b0c10; border: 2px solid #ffffff; padding: 12px 24px; font-weight: bold; border-radius: 25px; cursor: pointer; text-transform: uppercase; }
        
        .CONTENEUR { padding: 25px; max-width: 550px; margin: 0 auto; }
        .CARTE-STUDIO { background: #1f2833; border: 1px solid #45a29e; border-radius: 20px; padding: 35px; margin-top: 20px; text-align: center; }
        .STATUT-ANTENNE { display: inline-block; background: #252525; color: #aaa; padding: 8px 16px; border-radius: 30px; font-size: 14px; font-weight: bold; margin-bottom: 15px; border: 1px solid #444; }
        .STATUT-ANTENNE.en-direct { background: #ff0000; color: white; border-color: #ff6666; animation: flash 1.5s infinite; }
        .STATUT-ANTENNE.ia-direct { background: #a066ff; color: black; border-color: #fff; font-weight: 900; animation: flash 1s infinite; }
        .COMPTEUR-REEL { background-color: #0b0c10; color: #66fcf1; padding: 12px; border-radius: 10px; font-size: 18px; font-weight: bold; margin: 20px 0; border: 1px solid #45a29e; text-align: center; }
        
        .BOUTON-PLAY { background: linear-gradient(90deg, #66fcf1, #45a29e); color: #0b0c10; border: none; border-radius: 50px; padding: 16px 35px; font-size: 16px; font-weight: bold; cursor: pointer; display: block; width: 100%; max-width: 300px; margin: 0 auto; text-transform: uppercase; transition: all 0.3s; }
        .BOUTON-PLAY.actif { background: linear-gradient(90deg, #ff0000, #ff6600); color: white; box-shadow: 0 0 15px rgba(255, 0, 0, 0.6); }
        .BOUTON-PLAY.ia-actif { background: linear-gradient(90deg, #a066ff, #66fcf1); color: black; box-shadow: 0 0 15px rgba(160, 102, 255, 0.8); }
        
        /* ESPACE TCHAT & COMMENTAIRES */
        .ZONE-CHAT { margin-top: 25px; text-align: left; }
        .CHAT-LIVE { background: #0b0c10; border: 1px solid #45a29e; height: 180px; overflow-y: auto; border-radius: 10px; padding: 12px; font-size: 13px; display: flex; flex-direction: column; gap: 8px; }
        .MESSAGE { background: #1f2833; padding: 8px 12px; border-radius: 8px; border-left: 3px solid #66fcf1; }
        .MESSAGE .PSEUDO { color: #ffcc00; font-weight: bold; margin-right: 5px; }
        .BLOC-ENVOI { display: flex; gap: 10px; margin-top: 10px; }
        .INPUT-TEXT { flex: 1; padding: 12px; background: #0b0c10; color: white; border: 1px solid #45a29e; border-radius: 8px; }
        .BOUTON-ENVOYER { background: #66fcf1; color: #0b0c10; border: none; padding: 0 20px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        
        /* BOUTON PAROLE AUDITEUR */
        .BOUTON-DEMANDE-PAROLE { background: #ffcc00; color: #0b0c10; border: none; width: 100%; padding: 12px; font-weight: bold; border-radius: 8px; margin-top: 15px; cursor: pointer; text-transform: uppercase; }
        .BOUTON-DEMANDE-PAROLE.attente { background: #555; color: #aaa; cursor: not-allowed; }

        /* CONSOLE TRANSFR STUDIO ADMIN */
        .CARTE-ADMIN { display: none; background: #1f2833; border: 2px solid #ffcc00; border-radius: 20px; padding: 30px; text-align: left; margin-top: 20px; }
        select, .ACTION-ADMIN { width: 100%; padding: 14px; margin-bottom: 15px; background: #0b0c10; color: white; border: 1px solid #45a29e; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .ACTION-ADMIN { background: #66fcf1; color: #0b0c10; font-weight: bold; cursor: pointer; border: none; border-radius: 50px; text-transform: uppercase; }
        .BOUTON-LANCER-LIVE { background: linear-gradient(90deg, #28a745, #1e7e34); color: white; font-size: 16px; font-weight: bold; padding: 16px; border-radius: 50px; border: 2px solid white; cursor: pointer; width: 100%; text-transform: uppercase; margin-bottom: 15px; }
        .BOUTON-IA-REEL { background-color: #a066ff; color: black; font-size: 15px; font-weight: bold; padding: 15px; border-radius: 10px; border: 2px solid white; cursor: pointer; width: 100%; text-transform: uppercase; margin-bottom: 20px; }
        .LISTE-DEMANDES { background: #0b0c10; padding: 15px; border-radius: 10px; border: 1px solid #ffcc00; margin-bottom: 20px; min-height: 50px; }
        .DEMANDE-ITEM { display: flex; justify-content: space-between; align-items: center; background: #1f2833; padding: 8px; border-radius: 6px; margin-bottom: 8px; }

        /* SECTION PODCASTS */
        .SECTION-PODCASTS { margin-top: 30px; border-top: 1px solid #45a29e; padding-top: 20px; text-align: left; }
        .BOX-PODCAST { background: #0b0c10; padding: 15px; border-radius: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #252525; }

        /* SÉCURITÉ CLAVIER & COMPTE */
        .FOND-POPUP { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 99999; }
        .BOITE-POPUP { background: #1f2833; padding: 25px; border-radius: 15px; border: 2px solid #66fcf1; text-align: center; width: 290px; }
        .ECRAN-CODE { width: 100%; padding: 12px; font-size: 22px; text-align: center; background: #0b0c10; color: #ffcc00; border: 1px solid #45a29e; border-radius: 8px; margin-bottom: 15px; letter-spacing: 5px; font-weight: bold; }

        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="BARRE-HAUT">
        <div class="TITRE-RADIO">🌐 TRANSFR <span>STUDIO</span></div>
        <button class="BOUTON-JAUNE-ADMIN" onclick="ouvrirFenetreCode()">⚙️ Studio Admin</button>
    </div>

    <div class="CONTENEUR">
        <div id="ecranPublic">
            <div class="CARTE-STUDIO">
                <div id="badgeDirect" class="STATUT-ANTENNE">⚫ ANTENNE HORS-LIGNE</div>
                <div id="vraiCompteur" class="COMPTEUR-REEL">👥 Connectés : 1 auditeur</div>
                
                <button id="boutonEcouterLive" class="BOUTON-PLAY" onclick="declencherEcouteFluxDirect()">▶️ ÉCOUTER LE LIVE</button>
                
                <button id="btnDemandeParole" class="BOUTON-DEMANDE-PAROLE" onclick="demanderAPrendreLaParole()">🎙️ Demander à prendre la parole</button>
