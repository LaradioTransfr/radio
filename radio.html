<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRANSFR STUDIO - Sécurité Podcasts</title>
    <style>
        /* DESIGN GLOBAL TRANSFR */
        body { background-color: #0b0c10; color: #ffffff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        .BARRE-HAUT { background-color: #1f2833; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #66fcf1; }
        .TITRE-RADIO { font-size: 26px; font-weight: bold; }
        .TITRE-RADIO span { color: #66fcf1; }
        .BOUTON-JAUNE-ADMIN { background-color: #ffcc00; color: #0b0c10; border: 2px solid #ffffff; padding: 12px 24px; font-weight: bold; border-radius: 25px; cursor: pointer; text-transform: uppercase; }
        
        .CONTENEUR { padding: 25px; max-width: 580px; margin: 0 auto; }
        .CARTE-STUDIO { background: #1f2833; border: 1px solid #45a29e; border-radius: 20px; padding: 35px; margin-top: 20px; text-align: center; }
        
        .STATUT-ANTENNE { display: inline-block; background: #252525; color: #aaa; padding: 8px 18px; border-radius: 30px; font-size: 14px; font-weight: bold; margin-bottom: 15px; border: 1px solid #444; }
        .STATUT-ANTENNE.en-direct { background: #ff0000; color: white; animation: flash 1.5s infinite; }
        .STATUT-ANTENNE.ia-direct { background: #a066ff; color: white; animation: flash 1s infinite; }

        /* PLAYER PERSISTANT */
        #playerGlobal { background: #111; border: 1px solid #66fcf1; border-radius: 15px; padding: 15px; margin-bottom: 20px; display: none; text-align: left; }
        #playerGlobal span { font-weight: bold; color: #66fcf1; display: block; margin-bottom: 5px; font-size: 14px; }
        audio { width: 100%; height: 35px; filter: invert(100%) hue-rotate(180deg) brightness(1.5); }

        .BOUTON-PLAY { background: linear-gradient(90deg, #66fcf1, #45a29e); color: #0b0c10; border: none; border-radius: 50px; padding: 16px 35px; font-size: 16px; font-weight: bold; cursor: pointer; display: block; width: 100%; max-width: 320px; margin: 0 auto; text-transform: uppercase; }
        
        .SECTION-PODCASTS { margin-top: 30px; border-top: 1px solid #45a29e; padding-top: 20px; text-align: left; }
        .BOX-PODCAST { background: #0b0c10; padding: 15px; border-radius: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #252525; border-left: 4px solid #ffcc00; }
        .BOX-PODCAST.prive { border-left-color: #ff3333; }
        .BOX-PODCAST span { font-weight: bold; font-size: 15px; }
        .BADGE-TYPE { font-size: 10px; padding: 3px 8px; border-radius: 10px; margin-left: 8px; font-weight: bold; text-transform: uppercase; }
        .BADGE-TYPE.pub { background: #28a745; color: white; }
        .BADGE-TYPE.priv { background: #ff3333; color: white; }
        
        .BTN-LANCER { background: #ffcc00; color: #000; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; }

        /* FORMULAIRES ADMIN */
        .CARTE-ADMIN { display: none; background: #1f2833; border: 2px solid #ffcc00; border-radius: 20px; padding: 30px; margin-top: 20px; text-align: left; }
        .ACTION-ADMIN { width: 100%; padding: 14px; background: #66fcf1; color: #0b0c10; font-weight: bold; cursor: pointer; border: none; border-radius: 50px; text-transform: uppercase; margin-bottom: 15px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; background: #000; border: 1px solid #45a29e; color: white; border-radius: 8px; box-sizing: border-box; }

        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="BARRE-HAUT">
        <div class="TITRE-RADIO">🌐 TRANSFR <span>STUDIO</span></div>
        <button class="BOUTON-JAUNE-ADMIN" onclick="ouvrirFenetreCode()">⚙️ Studio Admin</button>
    </div>

    <div class="CONTENEUR">
        <div id="playerGlobal">
            <span id="nomPodcastEnCours">Lecture : Aucun podcast</span>
            <audio id="mainAudio" controls></audio>
        </div>

        <div id="ecranPublic">
            <div class="CARTE-STUDIO">
                <div id="badgeDirect" class="STATUT-ANTENNE">⚫ ANTENNE HORS-LIGNE</div>
                <button id="boutonEcouterLive" class="BOUTON-PLAY" disabled>▶️ ÉCOUTER LE LIVE</button>
                
                <div class="SECTION-PODCASTS">
                    <h3 style="color:#66fcf1; margin:0 0 15px 0;">🎙️ Archives Podcasts</h3>
                    <div id="espacePodcastsPublic"></div>
                </div>
            </div>
        </div>

        <div id="ecranAdmin" class="CARTE-ADMIN">
            <h2 style="color:#ffcc00; margin-bottom: 20px;">🎛️ CONSOLE PODCAST</h2>
            
            <label>Titre de l'émission :</label>
            <input type="text" id="titrePod" placeholder="Ex: L'aventure Spatiale - Épisode 1">
            
            <label>Lien MP3 du fichier :</label>
            <input type="text" id="urlPod" placeholder="https://monsite.com/audio.mp3">
            
            <label>Confidentialité :</label>
            <select id="typePod" onchange="gestionAffichagePinAdmin()">
                <option value="public">🔓 Public (Accessible à tous)</option>
                <option value="prive">🔒 Privé (Protégé par code PIN)</option>
            </select>

            <div id="zonePinAdmin" style="display: none;">
                <label style="color: #ff3333; font-weight: bold;">🔑 Définir le Code PIN (4 chiffres) :</label>
                <input type="text" id="pinPod" placeholder="Ex: 1234" maxlength="4">
            </div>

            <button class="ACTION-ADMIN" onclick="uploaderPodcast()">🚀 Publier sur la Radio</button>
            <button class="ACTION-ADMIN" style="background:#333; color:white;" onclick="location.reload()">Quitter</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://transfr-radio-default-rtdb.europe-west1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function ouvrirFenetreCode() {
            let code = prompt("Code de sécurité Transfr :");
            if(code === "1944") {
                document.getElementById("ecranPublic").style.display = "none";
                document.getElementById("ecranAdmin").style.display = "block";
            }
        }

        function gestionAffichagePinAdmin() {
            let type = document.getElementById("typePod").value;
            document.getElementById("zonePinAdmin").style.display = (type === "prive") ? "block" : "none";
        }

        function uploaderPodcast() {
            let titre = document.getElementById("titrePod").value.trim();
            let url = document.getElementById("urlPod").value.trim();
            let type = document.getElementById("typePod").value;
            let pin = document.getElementById("pinPod").value.trim();
            
            if(!titre || !url) return alert("Remplis le titre et le lien !");
            if(type === "prive" && pin.length < 4) return alert("Le code PIN doit faire 4 chiffres !");
            
            database.ref("podcasts").push({
                titre: titre,
                url: url,
                type: type,
                pin: type === "prive" ? pin : "",
                timestamp: Date.now()
            });
            
            alert("Podcast synchronisé avec succès !");
            document.getElementById("titrePod").value = "";
            document.getElementById("urlPod").value = "";
            document.getElementById("pinPod").value = "";
            document.getElementById("typePod").value = "public";
            document.getElementById("zonePinAdmin").style.display = "none";
        }

        // GESTION DU CLIC DE LECTURE AVEC VÉRIFICATION DU PIN
        function tentativeLecturePodcast(titre, url, type, codeCorrect) {
            if(type === "prive") {
                let codeSaisi = prompt("🔒 Ce podcast est privé.\nEntre le code PIN à 4 chiffres pour le débloquer :");
                if(codeSaisi === codeCorrect) {
                    lancerAudio(titre, url);
                } else {
                    alert("❌ Code PIN incorrect ! Accès refusé.");
                }
            } else {
                lancerAudio(titre, url);
            }
        }

        function lancerAudio(titre, url) {
            const playerDiv = document.getElementById("playerGlobal");
            const audio = document.getElementById("mainAudio");
            const nom = document.getElementById("nomPodcastEnCours");

            playerDiv.style.display = "block";
            nom.innerText = "🎧 EN ÉCOUTE : " + titre;
            audio.src = url;
            audio.play();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // MISE À JOUR DE LA LISTE EN TEMPS RÉEL
        database.ref("podcasts").on("value", snap => {
            let espace = document.getElementById("espacePodcastsPublic");
            espace.innerHTML = "";
            snap.forEach(child => {
                let pod = child.val();
                let estPrive = (pod.type === "prive");
                let badgeHtml = estPrive ? '<span class="BADGE-TYPE priv">🔒 Privé</span>' : '<span class="BADGE-TYPE pub">🔓 Public</span>';
                let classePrive = estPrive ? 'prive' : '';

                espace.innerHTML += `
                    <div class="BOX-PODCAST ${classePrive}">
                        <div>
                            <span>🎙️ ${pod.titre}</span>
                            ${badgeHtml}
                        </div>
                        <button class="BTN-LANCER" onclick="tentativeLecturePodcast('${pod.titre.replace(/'/g, "\\'")}', '${pod.url}', '${pod.type}', '${pod.pin}')">▶️ Lancer</button>
                    </div>`;
            });
        });

        // SYNCHRO STATUS LIVE
        database.ref("radio_synchro").on("value", snap => {
            let data = snap.val() || { statut: "eteint" };
            let badge = document.getElementById("badgeDirect");
            if(data.statut === "humain") {
                badge.innerText = "🔴 EN DIRECT"; badge.className = "STATUT-ANTENNE en-direct";
            } else if(data.statut === "ia") {
                badge.innerText = "🤖 IA AUTOPILOTE"; badge.className = "STATUT-ANTENNE ia-direct";
            } else {
                badge.innerText = "⚫ HORS-LIGNE"; badge.className = "STATUT-ANTENNE";
            }
        });
    </script>
</body>
</html>
