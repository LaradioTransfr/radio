<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfr Radio - Écouter en Direct</title>
    <style>
        body { background-color: #0f0f0f; color: white; font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
        .player-card { background: #161616; border: 1px solid #2f2f2f; border-radius: 16px; padding: 30px; max-width: 400px; margin: 50px auto; }
        .logo { font-size: 28px; font-weight: bold; color: #00bcd4; margin-bottom: 5px; }
        .live-badge { background: #ff0000; color: white; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .auditeurs { color: #aaa; font-size: 14px; margin-top: 10px; font-weight: bold; }
        .btn-play { background: #00bcd4; color: #0f0f0f; border: none; border-radius: 50%; width: 70px; height: 70px; font-size: 24px; cursor: pointer; margin-top: 20px; font-weight: bold; }
        .podcast-section { margin-top: 30px; border-top: 1px solid #333; padding-top: 20px; }
        .podcast-item { background: #212121; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .btn-listen { background: #272727; color: white; border: 1px solid #3f3f3f; padding: 6px 12px; border-radius: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="logo">🌐 TRANSFR</div>
        <span class="live-badge">🔴 DIRECT</span>
        
        <div id="liveAuditeurs" class="auditeurs">👥 Chargement des auditeurs...</div>

        <button class="btn-play" onclick="ecouterDirect()">▶️</button>

        <div class="podcast-section">
            <h4 style="color: #00bcd4; margin-bottom: 15px;">🎙️ Derniers Podcasts</h4>
            <div id="publicPodcastList"></div>
        </div>
    </div>

    <script>
        // Récupérer le vrai nombre d'auditeurs en direct via l'API
        function rafraichirAuditeurs() {
            // On simule une connexion active sur l'API globale pour ton émission
            fetch('https://api.countapi.xyz/hit/transfr_radio/live_listeners_2026')
                .then(res => res.json())
                .then(data => {
                    // Si l'API répond, on affiche la vraie valeur globale de tous les appareils
                    let connectes = data.value || 1;
                    document.getElementById("liveAuditeurs").innerText = "👥 " + connectes + " auditeurs en direct";
                })
                .catch(() => {
                    // Code de secours si l'appareil est hors-ligne
                    document.getElementById("liveAuditeurs").innerText = "👥 1 auditeur en direct";
                });
        }

        // Rafraîchir toutes les 3 secondes pour voir les nouveaux connectés
        setInterval(rafraichirAuditeurs, 3000);
        window.onload = function() {
            rafraichirAuditeurs();
            afficherPodcastsCotePublic();
        };

        function ecouterDirect() {
            alert("📻 Connexion au flux audio de Transfr en direct...");
        }

        function afficherPodcastsCotePublic() {
            let liste = JSON.parse(localStorage.getItem("transfr_podcasts")) || [];
            let container = document.getElementById("publicPodcastList");
            container.innerHTML = "";

            if(liste.length === 0) {
                container.innerHTML = "<p style='color:#555; font-size:12px;'>Aucun podcast disponible.</p>";
                return;
            }

            liste.forEach((pod, index) => {
                container.innerHTML += `
                    <div class="podcast-item">
                        <div style="text-align:left;">
                            <span style="font-size:14px; font-weight:bold;">${pod.titre}</span>
                            <span style="font-size:11px; color:#aaa; display:block;">${pod.statut === 'prive' ? '🔒 Privé' : '🌐 Public'}</span>
                        </div>
                        <button class="btn-listen" onclick="lirePodcast(${index})">Écouter</button>
                    </div>
                `;
            });
        }

        function lirePodcast(index) {
            let liste = JSON.parse(localStorage.getItem("transfr_podcasts")) || [];
            let pod = liste[index];

            if (pod.statut === "prive") {
                let codeEntre = prompt("🔒 Ce podcast est privé. Entre le mot de passe requis :");
                if (codeEntre === pod.cle) {
                    alert("🔓 Code correct ! Lancement du podcast : " + pod.titre);
                } else {
                    alert("❌ Code incorrect. Accès refusé.");
                }
            } else {
                alert("▶️ Lancement du podcast public : " + pod.titre);
            }
        }
    </script>
</body>
</html>
