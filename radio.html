<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfr Radio - Network Premium</title>
    <style>
        body { background-color: #0b0c10; color: #ffffff; font-family: sans-serif; margin: 0; padding: 0; }
        .BARRE-HAUT { background-color: #1f2833; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #66fcf1; }
        .TITRE-RADIO { font-size: 26px; font-weight: bold; }
        .TITRE-RADIO span { color: #66fcf1; }
        .BOUTON-JAUNE-ADMIN { background-color: #ffcc00; color: #0b0c10; border: 2px solid #ffffff; padding: 12px 24px; font-weight: bold; border-radius: 25px; cursor: pointer; text-transform: uppercase; }
        .CONTENEUR { padding: 25px; max-width: 550px; margin: 0 auto; }
        .CARTE-STUDIO { background: #1f2833; border: 1px solid #45a29e; border-radius: 20px; padding: 35px; margin-top: 20px; text-align: center; }
        .STATUT-ANTENNE { display: inline-block; background: #252525; color: #aaa; padding: 8px 16px; border-radius: 30px; font-size: 14px; font-weight: bold; margin-bottom: 15px; border: 1px solid #444; }
        .STATUT-ANTENNE.en-direct { background: #ff0000; color: white; border-color: #ff6666; animation: flash 1.5s infinite; }
        .STATUT-ANTENNE.ia-direct { background: #a066ff; color: black; border-color: #fff; font-weight: 900; animation: flash 1s infinite; }
        .COMPTEUR-REEL { background-color: #0b0c10; color: #66fcf1; padding: 12px; border-radius: 10px; font-size: 18px; font-weight: bold; margin: 20px 0; border: 1px solid #45a29e; text-align: center; }
        .BOUTON-PLAY { background: linear-gradient(90deg, #66fcf1, #45a29e); color: #0b0c10; border: none; border-radius: 50px; padding: 16px 35px; font-size: 16px; font-weight: bold; cursor: pointer; display: block; width: 100%; max-width: 300px; margin: 0 auto; text-transform: uppercase; }
        .BOUTON-PLAY.actif { background: linear-gradient(90deg, #ff0000, #ff6600); color: white; box-shadow: 0 0 15px rgba(255, 0, 0, 0.6); }
        .BOUTON-PLAY.ia-actif { background: linear-gradient(90deg, #a066ff, #66fcf1); color: black; box-shadow: 0 0 15px rgba(160, 102, 255, 0.8); }
        .CHAT-LIVE { background: #0b0c10; border: 1px solid #333; height: 110px; overflow-y: auto; border-radius: 10px; margin-top: 20px; padding: 12px; text-align: left; font-size: 13px; }
        .SECTION-PODCASTS { margin-top: 30px; border-top: 1px solid #45a29e; padding-top: 20px; text-align: left; }
        .BOX-PODCAST { background: #0b0c10; padding: 15px; border-radius: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #252525; }
        
        /* CONSOLE ADMIN */
        .CARTE-ADMIN { display: none; background: #1f2833; border: 2px solid #ffcc00; border-radius: 20px; padding: 30px; text-align: left; margin-top: 20px; }
        input, select, .ACTION-ADMIN { width: 100%; padding: 14px; margin-bottom: 15px; background: #0b0c10; color: white; border: 1px solid #45a29e; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .ACTION-ADMIN { background: #66fcf1; color: #0b0c10; font-weight: bold; cursor: pointer; border: none; border-radius: 50px; text-transform: uppercase; }
        .BOUTON-MICRO { background-color: #ff3333; color: white; font-size: 15px; font-weight: bold; padding: 15px; border-radius: 10px; border: 2px solid white; cursor: pointer; width: 100%; text-transform: uppercase; margin-bottom: 15px; }
        .BOUTON-IA-REEL { background-color: #a066ff; color: black; font-size: 15px; font-weight: bold; padding: 15px; border-radius: 10px; border: 2px solid white; cursor: pointer; width: 100%; text-transform: uppercase; margin-bottom: 20px; }
        
        /* FENÊTRE CLAVIER CODE STUDIO 1944 */
        .FOND-POPUP { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 99999; }
        .BOITE-POPUP { background: #1f2833; padding: 25px; border-radius: 15px; border: 2px solid #ffcc00; text-align: center; width: 280px; }
        .ECRAN-CODE { width: 100%; padding: 12px; font-size: 22px; text-align: center; background: #0b0c10; color: #ffcc00; border: 1px solid #45a29e; border-radius: 8px; margin-bottom: 15px; letter-spacing: 5px; font-weight: bold; }

        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="BARRE-HAUT">
        <div class="TITRE-RADIO">🌐 TRANSFR <span>STUDIO</span></div>
        <button class="BOUTON-JAUNE-ADMIN" onclick="ouvrirFenetreCode()">⚙️ Studio Admin</button>
    </div>

    <div class="CONTENEUR">
        <div id="ecranPublic">
            <div class="CARTE-STUDIO">
                <div id="badgeDirect" class="STATUT-ANTENNE">⚫ ANTENNE HORS-LIGNE (PAS DE DIRECT)</div>
                <div id="vraiCompteur" class="COMPTEUR-REEL">👥 Connectés : Chargement...</div>
                
                <button id="boutonEcouterLive" class="BOUTON-PLAY" onclick="declencherEcouteFluxDirect()">▶️ ÉCOUTER LE LIVE</button>
                
                <div id="boiteChat" class="CHAT-LIVE"><p style="margin:0; color:#666;">Connexion au réseau Transfr...</p></div>
                
                <div class="SECTION-PODCASTS">
                    <h3 style="color:#66fcf1; margin:0 0 15px 0;">🎙️ Émissions & Podcasts Récents</h3>
                    <div id="espacePodcastsPublic"></div>
                </div>
            </div>
        </div>

        <div id="ecranAdmin" class="CARTE-ADMIN">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <h2 style="color:#ffcc00; margin:0; font-size: 20px;">🎛️ CONSOLE TRANSFR MAIN</h2>
                <button onclick="fermerLeStudio()" style="background:#ff3333; color:white; border:none; padding:8px 14px; cursor:pointer; font-weight:bold; border-radius: 5px;">Quitter</button>
            </div>

            <button class="BOUTON-MICRO" onclick="demanderMicroEtLancerPodcast()">🎙️ Activer mon Micro</button>

            <button id="boutonControleIa" class="BOUTON-IA-REEL" onclick="basculerControleIaTransfr()">🤖 Donner le contrôle à l'IA Transfr</button>

            <button class="ACTION-ADMIN" style="background-color: #28a745; color: white; margin-bottom:10px;" onclick="changerStatutDirectAntenne('humain')">🚀 Ouvrir l'Antenne (Moi au Micro)</button>
            <button class="ACTION-ADMIN" style="background-color: #333; color: #aaa; margin-bottom:20px;" onclick="changerStatutDirectAntenne('eteint')">🛑 Éteindre l'Antenne</button>
            
            <hr style="border-color:#45a29e; margin:20px 0;">
            
            <h3 style="color:#66fcf1; font-size:16px; margin-bottom:10px;">🎙️ Publier un Podcast</h3>
            <input type="text" id="titrePod" placeholder="Nom de ton émission...">
            <select id="statutPod" onchange="document.getElementById('sousCode').style.display = (this.value === 'prive') ? 'block' : 'none';">
                <option value="public">🌐 Public (Visible partout instantanément)</option>
                <option value="prive">🔒 Privé (Protégé par mot de passe)</option>
            </select>
            <div id="sousCode" style="display:none; background:#0b0c10; padding:15px; border:1px dashed #ffcc00; margin-bottom:15px;">
                <input type="text" id="codeSecretPod" value="TRANSFR">
            </div>
            <button class="ACTION-ADMIN" onclick="uploaderPodcast()">🚀 Envoyer aux autres appareils</button>
        </div>
    </div>

    <div id="popupVerrou" class="FOND-POPUP">
        <div class="BOITE-POPUP">
            <h3 style="color:#ffcc00; margin-top:0; font-size:16px;">🔒 CODE COMPTE STUDIO</h3>
            <input type="password" id="ecranSaisieCode" class="ECRAN-CODE" readonly placeholder="••••">
            <input type="text" id="champsClavierCache" placeholder="Tape le code..." style="background:transparent; color:white; text-align:center; border:1px solid #444; width:100%; padding:10px; border-radius:6px;" oninput="document.getElementById('ecranSaisieCode').value = this.value;">
            <button class="ACTION-ADMIN" style="margin-top:15px;" onclick="validerCodeStudio()">VALIDER</button>
            <button class="ACTION-ADMIN" style="background:#333; color:white; margin-top:8px;" onclick="fermerFenetreCode()">ANNULER</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://transfr-radio-default-rtdb.europe-west1.firebasedatabase.app/" };
        let database;
        try { firebase.initializeApp(firebaseConfig); database = firebase.database(); } catch(e) {}

        let monID = "user_" + Math.floor(Math.random() * 100000);
        const CODE_STUDIO_VRAI = "1944"; 
        let statutAntenneActuel = "eteint"; // Peut être 'eteint', 'humain', ou 'ia'
        let audioContext = null;
        let iaBoucleAudio = null;

        const artistesIA = ["LAKEY INSPIRED", "Idealism", "TheFatRat", "Tobu", "Kevin MacLeod"];

        function ouvrirFenetreCode() {
            document.getElementById("popupVerrou").style.display = "flex";
            document.getElementById("champsClavierCache").value = "";
            document.getElementById("ecranSaisieCode").value = "";
            document.getElementById("champsClavierCache").focus();
        }
        function fermerFenetreCode() { document.getElementById("popupVerrou").style.display = "none"; }

        function validerCodeStudio() {
            if (document.getElementById("champsClavierCache").value === CODE_STUDIO_VRAI) {
                fermerFenetreCode();
                document.getElementById("ecranPublic").style.display = "none";
                document.getElementById("ecranAdmin").style.display = "block";
            } else {
                alert("❌ Code erroné !");
                document.getElementById("champsClavierCache").value = "";
                document.getElementById("ecranSaisieCode").value = "";
            }
        }

        function fermerLeStudio() {
            document.getElementById("ecranAdmin").style.display = "none";
            document.getElementById("ecranPublic").style.display = "block";
        }

            try {
                await navigator.mediaDevices.getUserMedia({ audio: true });
                alert("🎙️ Micro branché et autorisé ! Prêt pour l'antenne.");
            } catch (err) {
                alert("❌ Micro introuvable ou accès bloqué.");
            }
        }
