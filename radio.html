<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRANSFR STUDIO - Live Network</title>
    <style>
        body { background-color: #0b0c10; color: #ffffff; font-family: sans-serif; margin: 0; padding: 0; }
        .BARRE-HAUT { background-color: #1f2833; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #66fcf1; }
        .TITRE-RADIO { font-size: 26px; font-weight: bold; letter-spacing: 1px; }
        .TITRE-RADIO span { color: #66fcf1; }
        .BOUTON-JAUNE-ADMIN { background-color: #ffcc00; color: #0b0c10; border: 2px solid #ffffff; padding: 12px 24px; font-weight: bold; border-radius: 25px; cursor: pointer; text-transform: uppercase; }
        .CONTENEUR { padding: 25px; max-width: 550px; margin: 0 auto; }
        .CARTE-STUDIO { background: #1f2833; border: 1px solid #45a29e; border-radius: 20px; padding: 35px; margin-top: 20px; text-align: center; }
        .STATUT-ANTENNE { display: inline-block; background: #252525; color: #aaa; padding: 8px 16px; border-radius: 30px; font-size: 14px; font-weight: bold; margin-bottom: 15px; border: 1px solid #444; }
        .STATUT-ANTENNE.en-direct { background: #ff0000; color: white; border-color: #ff6666; animation: flash 1.5s infinite; }
        .STATUT-ANTENNE.ia-direct { background: #a066ff; color: black; border-color: #fff; font-weight: 900; animation: flash 1s infinite; }
        .COMPTEUR-REEL { background-color: #0b0c10; color: #66fcf1; padding: 12px; border-radius: 10px; font-size: 18px; font-weight: bold; margin: 20px 0; border: 1px solid #45a29e; text-align: center; }
        .BOUTON-PLAY { background: linear-gradient(90deg, #66fcf1, #45a29e); color: #0b0c10; border: none; border-radius: 50px; padding: 16px 35px; font-size: 16px; font-weight: bold; cursor: pointer; display: block; width: 100%; max-width: 300px; margin: 0 auto; text-transform: uppercase; transition: all 0.3s; }
        .BOUTON-PLAY.actif { background: linear-gradient(90deg, #ff0000, #ff6600); color: white; box-shadow: 0 0 15px rgba(255, 0, 0, 0.6); }
        .BOUTON-PLAY.ia-actif { background: linear-gradient(90deg, #a066ff, #66fcf1); color: black; box-shadow: 0 0 15px rgba(160, 102, 255, 0.8); }
        .CHAT-LIVE { background: #0b0c10; border: 1px solid #333; height: 110px; overflow-y: auto; border-radius: 10px; margin-top: 20px; padding: 12px; text-align: left; font-size: 13px; }
        .SECTION-PODCASTS { margin-top: 30px; border-top: 1px solid #45a29e; padding-top: 20px; text-align: left; }
        .BOX-PODCAST { background: #0b0c10; padding: 15px; border-radius: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #252525; }
        
        /* CONSOLE TRANSFR STUDIO ADMIN */
        .CARTE-ADMIN { display: none; background: #1f2833; border: 2px solid #ffcc00; border-radius: 20px; padding: 30px; text-align: left; margin-top: 20px; }
        input, select, .ACTION-ADMIN { width: 100%; padding: 14px; margin-bottom: 15px; background: #0b0c10; color: white; border: 1px solid #45a29e; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .ACTION-ADMIN { background: #66fcf1; color: #0b0c10; font-weight: bold; cursor: pointer; border: none; border-radius: 50px; text-transform: uppercase; }
        .BOUTON-LANCER-LIVE { background: linear-gradient(90deg, #28a745, #1e7e34); color: white; font-size: 16px; font-weight: bold; padding: 16px; border-radius: 50px; border: 2px solid white; cursor: pointer; width: 100%; text-transform: uppercase; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(40,167,69,0.3); }
        .BOUTON-IA-REEL { background-color: #a066ff; color: black; font-size: 15px; font-weight: bold; padding: 15px; border-radius: 10px; border: 2px solid white; cursor: pointer; width: 100%; text-transform: uppercase; margin-bottom: 20px; }
        
        /* POPUP SÉCURITÉ CODE 1944 */
        .FOND-POPUP { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 99999; }
        .BOITE-POPUP { background: #1f2833; padding: 25px; border-radius: 15px; border: 2px solid #ffcc00; text-align: center; width: 280px; }
        .ECRAN-CODE { width: 100%; padding: 12px; font-size: 22px; text-align: center; background: #0b0c10; color: #ffcc00; border: 1px solid #45a29e; border-radius: 8px; margin-bottom: 15px; letter-spacing: 5px; font-weight: bold; }

        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="BARRE-HAUT">
        <div class="TITRE-RADIO">🌐 TRANSFR <span>STUDIO</span></div>
        <button class="BOUTON-JAUNE-ADMIN" onclick="ouvrirFenetreCode()">⚙️ Studio Admin</button>
    </div>

    <div class="CONTENEUR">
        <div id="ecranPublic">
            <div class="CARTE-STUDIO">
                <div id="badgeDirect" class="STATUT-ANTENNE">⚫ ANTENNE HORS-LIGNE (PAS DE DIRECT)</div>
                <div id="vraiCompteur" class="COMPTEUR-REEL">👥 Connectés : 1 auditeur</div>
                
                <button id="boutonEcouterLive" class="BOUTON-PLAY" onclick="declencherEcouteFluxDirect()">▶️ ÉCOUTER LE LIVE</button>
                
                <div id="boiteChat" class="CHAT-LIVE"><p style="margin:0; color:#666;">Salon TRANSFR STUDIO connecté...</p></div>
                
                <div class="SECTION-PODCASTS">
                    <h3 style="color:#66fcf1; margin:0 0 15px 0;">🎙️ Émissions & Podcasts Récents</h3>
                    <div id="espacePodcastsPublic"></div>
                </div>
            </div>
        </div>

        <div id="ecranAdmin" class="CARTE-ADMIN">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <h2 style="color:#ffcc00; margin:0; font-size: 20px;">🎛️ CONSOLE TRANSFR MAIN</h2>
                <button onclick="fermerLeStudio()" style="background:#ff3333; color:white; border:none; padding:8px 14px; cursor:pointer; font-weight:bold; border-radius: 5px;">Quitter</button>
            </div>

            <button id="boutonLancerLiveAdmin" class="BOUTON-LANCER-LIVE" onclick="lancerLeDirectHumainComplet()">🚀 Lancer le Live & Activer le Micro</button>
            <button id="boutonControleIa" class="BOUTON-IA-REEL" onclick="basculerControleIaTransfr()">🤖 Donner le contrôle à l'IA Transfr</button>
            <button class="ACTION-ADMIN" style="background-color: #333; color: #aaa; margin-bottom:20px;" onclick="couperLAntenneGlobale()">🛑 Éteindre l'Antenne Générale</button>
            
            <hr style="border-color:#45a29e; margin:20px 0;">
            
            <h3 style="color:#66fcf1; font-size:16px; margin-bottom:10px;">🎙️ Publier un Podcast</h3>
            <input type="text" id="titrePod" placeholder="Nom de ton émission...">
            <select id="statutPod" onchange="document.getElementById('sousCode').style.display = (this.value === 'prive') ? 'block' : 'none';">
                <option value="public">🌐 Public (Visible partout instantanément)</option>
                <option value="prive">🔒 Privé (Protégé par mot de passe)</option>
            </select>
            <div id="sousCode" style="display:none; background:#0b0c10; padding:15px; border:1px dashed #ffcc00; margin-bottom:15px;">
                <input type="text" id="codeSecretPod" value="TRANSFR">
            </div>
            <button class="ACTION-ADMIN" onclick="uploaderPodcast()">🚀 Envoyer aux autres appareils</button>
        </div>
    </div>

    <div id="popupVerrou" class="FOND-POPUP">
        <div class="BOITE-POPUP">
            <h3 style="color:#ffcc00; margin-top:0; font-size:16px;">🔒 CODE COMPTE STUDIO</h3>
            <input type="password" id="ecranSaisieCode" class="ECRAN-CODE" readonly placeholder="••••">
            <input type="text" id="champsClavierCache" placeholder="Tape le code..." style="background:transparent; color:white; text-align:center; border:1px solid #444; width:100%; padding:10px; border-radius:6px;" oninput="document.getElementById('ecranSaisieCode').value = this.value;">
            <button class="ACTION-ADMIN" style="margin-top:15px;" onclick="validerCodeStudio()">VALIDER</button>
            <button class="ACTION-ADMIN" style="background:#333; color:white; margin-top:8px;" onclick="fermerFenetreCode()">ANNULER</button>
        </div>
    </div>

    <script>
        // Remplace par l'adresse de TA base Firebase si tu veux que ça marche sur ton vrai projet !
        const firebaseConfig = { databaseURL: "https://transfr-radio-default-rtdb.europe-west1.firebasedatabase.app/" };
        let database;
        try { firebase.initializeApp(firebaseConfig); database = firebase.database(); } catch(e) {}

        let monID = "user_" + Math.floor(Math.random() * 100000);
        const CODE_STUDIO_VRAI = "1944"; 
        let statutAntenneActuel = "eteint"; 
        let audioContext = null;
        let iaBoucleAudio = null;
        let ecouteEnCours = false;

        const artistesIA = ["LAKEY INSPIRED", "Idealism", "TheFatRat", "Tobu", "Kevin MacLeod"];

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        function ouvrirFenetreCode() {
            document.getElementById("popupVerrou").style.display = "flex";
            document.getElementById("champsClavierCache").value = "";
            document.getElementById("ecranSaisieCode").value = "";
            setTimeout(() => { document.getElementById("champsClavierCache").focus(); }, 100);
        }
        function fermerFenetreCode() { document.getElementById("popupVerrou").style.display = "none"; }

        function validerCodeStudio() {
            if (document.getElementById("champsClavierCache").value === CODE_STUDIO_VRAI) {
                fermerFenetreCode();
                document.getElementById("ecranPublic").style.display = "none";
                document.getElementById("ecranAdmin").style.display = "block";
                initAudio(); // Débloque le son aussi pour l'admin
            } else {
                alert("❌ Code erroné !");
                document.getElementById("champsClavierCache").value = "";
                document.getElementById("ecranSaisieCode").value = "";
            }
        }

        function fermerLeStudio() {
            document.getElementById("ecranAdmin").style.display = "none";
            document.getElementById("ecranPublic").style.display = "block";
        }

        async function lancerLeDirectHumainComplet() {
            initAudio();
            try {
                await navigator.mediaDevices.getUserMedia({ audio: true });
                if(database) database.ref("statut_direct").set("humain");
                
                let btnAdmin = document.getElementById("boutonLancerLiveAdmin");
                btnAdmin.innerText = "⚡ ANTENNE OUVERTE & MICRO OK";
                btnAdmin.style.background = "linear-gradient(90deg, #ff0000, #cc0000)";
                
                alert("🚀 TRANSFR STUDIO est en direct ! Le micro capte ton son.");
            } catch (err) {
                alert("❌ Impossible de lancer le live : Vérifie les autorisations de ton micro !");
            }
        }

        function couperLAntenneGlobale() {
            if(database) database.ref("statut_direct").set("eteint");
            let btnAdmin = document.getElementById("boutonLancerLiveAdmin");
            btnAdmin.innerText = "🚀 Lancer le Live & Activer le Micro";
            btnAdmin.style.background = "linear-gradient(90deg, #28a745, #1e7e34)";
            
            let btnIa = document.getElementById("boutonControleIa");
            btnIa.innerText = "🤖 Donner le contrôle à l'IA Transfr";
            btnIa.style.backgroundColor = "#a066ff";
            btnIa.style.color = "black";
            alert("🛑 Antenne éteinte.");
        }

        function genererBipIaMusique() {
            if (!ecouteEnCours) return; 
            try {
                initAudio();
                let osc = audioContext.createOscillator();
                let gain = audioContext.createGain();
                let notes = [261.63, 329.63, 392.00, 523.25];
                let frequenceChoisie = notes[Math.floor(Math.random() * notes.length)];
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(frequenceChoisie, audioContext.currentTime);
                gain.gain.setValueAtTime(0.08, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.5);
                
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.start();
                osc.stop(audioContext.currentTime + 0.5);
            } catch(e) {}
        }

        function basculerControleIaTransfr() {
            initAudio();
            let bouton = document.getElementById("boutonControleIa");
            if (statutAntenneActuel !== "ia") {
                if(database) database.ref("statut_direct").set("ia");
                bouton.innerText = "🛑 Reprendre les commandes (Stopper l'IA)";
                bouton.style.backgroundColor = "red";
                bouton.style.color = "white";
            } else {
                couperLAntenneGlobale();
            }
        }

        function declencherEcouteFluxDirect() {
            initAudio();
            let btnPlay = document.getElementById("boutonEcouterLive");

            if (!ecouteEnCours) {
                ecouteEnCours = true;
                btnPlay.innerText = "🛑 COUPER LE SON DU LIVE";
                btnPlay.style.background = "linear-gradient(90deg, #ff3333, #aa0000)";
                btnPlay.style.color = "white";

                if (statutAntenneActuel === "humain") {
                    alert("📻 Connexion établie ! Tu écoutes TRANSFR STUDIO en direct.");
                } else if (statutAntenneActuel === "ia") {
                    alert("🤖 Flux déverrouillé ! Musique de l'IA Transfr en cours...");
                } else {
                    alert("📻 Connecté au réseau TRANSFR STUDIO. En attente d'un live !");
                }
            } else {
                ecouteEnCours = false;
                btnPlay.innerText = "▶️ ÉCOUTER LE LIVE";
                actualiserDesignBouton();
                alert("🔈 Flux mis en pause.");
            }
        }

        function actualiserDesignBouton() {
            if (ecouteEnCours) return;
            let btnPlay = document.getElementById("boutonEcouterLive");
            if (statutAntenneActuel === "humain") {
                btnPlay.className = "BOUTON-PLAY actif";
                btnPlay.innerText = "⚡ REJOINDRE LE DIRECT EN COURS";
            } else if (statutAntenneActuel === "ia") {
                btnPlay.className = "BOUTON-PLAY ia-actif";
                btnPlay.innerText = "🎵 ÉCOUTER LE LIVE DE L'IA";
            } else {
                btnPlay.className = "BOUTON-PLAY";
                btnPlay.innerText = "▶️ ÉCOUTER LE LIVE";
            }
        }

        window.onload = function() {
            if(database) {
                database.ref("auditeurs_en_direct/" + monID).set(true);
                database.ref("auditeurs_en_direct/" + monID).onDisconnect().remove();
                
                database.ref("auditeurs_en_direct").on("value", function(s) {
                    let total = s.numChildren() || 1;
                    document.getElementById("vraiCompteur").innerText = "👥 Connectés en direct : " + total + (total > 1 ? " auditeurs" : " auditeur");
                });

                database.ref("statut_direct").on("value", function(s) {
                    statutAntenneActuel = s.val() || "eteint";
                    let b = document.getElementById("badgeDirect");
                    let chat = document.getElementById("boiteChat");

                    clearInterval(iaBoucleAudio);

                    if (statutAntenneActuel === "humain") {
                        b.innerText = "🔴 EN DIRECT SUR TOUS LES APPAREILS";
                        b.className = "STATUT-ANTENNE en-direct";
                        actualiserDesignBouton();
                    } 
                    else if (statutAntenneActuel === "ia") {
                        b.innerText = "🤖 IA TRANSFR EN CONTRÔLE";
                        b.className = "STATUT-ANTENNE ia-direct";
                        actualiserDesignBouton();
                        
                        iaBoucleAudio = setInterval(() => {
                            let art = artistesIA[Math.floor(Math.random() * artistesIA.length)];
                            chat.innerHTML = `<p style='color:#a066ff; margin:0;'><b>[🤖 TRANSFR IA]</b> : Diffusion d'un morceau de <b>${art}</b>...</p>`;
                            if (ecouteEnCours) genererBipIaMusique();
                        }, 2000);
                    } 
                    else {
                        b.innerText = "⚫ ANTENNE HORS-LIGNE (PAS DE DIRECT)";
                        b.className = "STATUT-ANTENNE";
                        actualiserDesignBouton();
                    }
                });

                database.ref("podcasts_partages").on("value", function(s) {
                    let l = []; s.forEach(function(c) { l.push(c.val()); });
                    let conteneur = document.getElementById("espacePodcastsPublic");
                    conteneur.innerHTML = l.length ? "" : "<p style='color:#666; font-size:12px;'>Aucun podcast disponible.</p>";
                    
                    l.reverse().forEach((p) => {
                        let typeBadge = p.statut === 'prive' ? '🔒 Privé' : '🌐 Public';
                        let couleurBadge = p.statut === 'prive' ? '#ffcc00' : '#66fcf1';
                        conteneur.innerHTML += `
                            <div class="BOX-PODCAST">
                                <div>
                                    <strong>${p.titre}</strong><br>
                                    <span style="font-size:11px; color:${couleurBadge}; font-weight:bold;">${typeBadge}</span>
                                </div>
                                <button onclick="lancerEcoute('${p.titre}','${p.statut}','${p.code}')" style="background:#66fcf1; border:none; padding:8px 14px; cursor:pointer; font-weight:bold; border-radius:6px; color:black;">Écouter</button>
                            </div>`;
                    });
                });
            }
        };

        function uploaderPodcast() {
            let t = document.getElementById("titrePod").value.trim();
            let s = document.getElementById("statutPod").value;
            let c = document.getElementById("codeSecretPod").value.trim();
            if(t === "") return alert("Mets un titre !");
            if(database) {
                database.ref("podcasts_partages").push({ titre: t, statut: s, code: (s === "prive" ? c : "") });
                document.getElementById("titrePod").value = "";
                alert("🚀 Podcast envoyé sur TRANSFR STUDIO !");
            }
        }

        function lancerEcoute(titre, statut, codeCorrect) {
            initAudio();
            if (statut === "prive") {
                let verif = prompt("🔒 Code d'écoute requis :");
                if (verif === codeCorrect) alert("🔓 Lecture : " + titre);
                else alert("❌ Code secret refusé.");
            } else { alert("▶️ Lecture du podcast : " + titre); }
        }
    </script>
</body>
</html>
