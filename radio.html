<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Transfr Radio Network</title>
    <style>
        body { 
            background-color: #0f0f0f; 
            color: white; 
            font-family: Arial, sans-serif; 
            margin: 0; padding: 0; 
        }

        /* BARRE DE NAVIGATION */
        .BARRE-HAUT {
            background-color: #161616;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #00bcd4;
        }
        .TITRE-RADIO { font-size: 24px; font-weight: bold; }
        .TITRE-RADIO span { color: #00bcd4; }

        /* BOUTON JAUNE ADMIN SÉCURISÉ */
        .BOUTON-JAUNE-ADMIN {
            background-color: #ffcc00;
            color: black;
            border: 2px solid white;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 0 10px rgba(255,204,0,0.5);
        }

        .CONTENEUR { padding: 20px; max-width: 500px; margin: 0 auto; }

        /* INTERFACE PUBLIC */
        .CARTE-STUDIO { background: #161616; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-top: 20px; }
        .BADGE-ROUGE { background: red; color: white; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        
        .COMPTEUR-REEL { 
            background-color: #000; color: #00ff66; 
            padding: 10px; border-radius: 8px; font-size: 18px; 
            font-weight: bold; margin: 15px 0; border: 1px solid #222;
        }

        .BOUTON-PLAY { background: #00bcd4; color: black; border: none; border-radius: 50px; padding: 15px 30px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }

        .CHAT-LIVE { background: black; border: 1px solid #333; height: 120px; overflow-y: auto; border-radius: 8px; margin-top: 15px; padding: 10px; text-align: left; font-size: 13px; }

        .SECTION-PODCASTS { margin-top: 25px; border-top: 1px solid #333; padding-top: 20px; text-align: left; }
        .BOX-PODCAST { background: #222; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

        /* INTERFACE ADMIN */
        .CARTE-ADMIN { display: none; background: #1a1a1a; border: 2px solid #ffcc00; border-radius: 16px; padding: 25px; text-align: left; margin-top: 20px; }
        input, select, .ACTION-ADMIN { width: 100%; padding: 12px; margin-bottom: 12px; background: black; color: white; border: 1px solid #444; border-radius: 6px; box-sizing: border-box; }
        .ACTION-ADMIN { background: #00bcd4; color: black; font-weight: bold; cursor: pointer; border: none; border-radius: 20px; }
        .BOUTON-IA { background: #a066ff; color: black; font-weight: bold; border: none; padding: 12px; width: 100%; border-radius: 6px; cursor: pointer; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="BARRE-HAUT">
        <div class="TITRE-RADIO">🌐 TRANSFR <span>RADIO</span></div>
        <button id="boutonAdmin" class="BOUTON-JAUNE-ADMIN">⚙️ STUDIO ADMIN</button>
    </div>

    <div class="CONTENEUR">

        <div id="ecranPublic">
            <div class="CARTE-STUDIO">
                <span class="BADGE-ROUGE">🔴 DIRECT ANTENNE</span>
                
                <div id="vraiCompteur" class="COMPTEUR-REEL">👥 Connectés : Chargement...</div>

                <button class="BOUTON-PLAY" onclick="ecouterDirect()">▶️ ÉCOUTER LE LIVE</button>

                <div id="boiteChat" class="CHAT-LIVE">
                    <p style="margin:0; color:#666;">Salon de discussion Transfr en ligne...</p>
                </div>

                <div class="SECTION-PODCASTS">
                    <h3 style="color:#00bcd4; margin:0 0 12px 0;">🎙️ Podcasts Partagés</h3>
                    <div id="espacePodcastsPublic"></div>
                </div>
            </div>
        </div>

        <div id="ecranAdmin" class="CARTE-ADMIN">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="color:#ffcc00; margin:0;">🎛️ CONSOLE TRANSFR</h2>
                <button onclick="fermerLeStudio()" style="background:red; color:white; border:none; padding:6px 12px; cursor:pointer; font-weight:bold;">Quitter</button>
            </div>

            <h4 style="color:#00bcd4; margin: 0 0 10px 0;">🔴 Gestion du Direct Public</h4>
            <p style="font-size:13px; color:#aaa;">Auditeurs sur l'antenne : <strong id="adminCompteurReel" style="color:#00ff66;">0</strong></p>
            <button id="btnIa" class="BOUTON-IA" onclick="declencherIA()">🤖 Lancer l'IA de secours</button>

            <hr style="border-color:#333; margin:20px 0;">

            <h4 style="color:#00bcd4; margin: 0 0 10px 0;">🎙️ Envoyer un Podcast sur tous les appareils</h4>
            <input type="text" id="titrePod" placeholder="Titre du podcast...">
            
            <label style="font-size:12px; color:#aaa;">Disponibilité :</label>
            <select id="statutPod" onchange="gestionMasqueCode()">
                <option value="public">🌐 Envoyer en Public (Tout le monde)</option>
                <option value="prive">🔒 Bloquer en Privé (Avec Code)</option>
            </select>

            <div id="sousCode" style="display:none; background:#000; padding:10px; border:1px dashed red; margin-bottom:12px;">
                <label style="color:red; font-size:12px; font-weight:bold;">🔑 Choisis le code secret pour les auditeurs :</label>
                <input type="text" id="codeSecretPod" value="TRANSFR">
            </div>

            <button class="ACTION-ADMIN" onclick="uploaderPodcast()">🚀 Envoyer le Podcast aux abonnés</button>
        </div>

    </div>
