<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRANSFR STUDIO - Global Synchro Network</title>
    <style>
        /* --- DESIGN GLOBAL TRANSFR --- */
        body { background-color: #0b0c10; color: #ffffff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        .BARRE-HAUT { background-color: #1f2833; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #66fcf1; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .TITRE-RADIO { font-size: 26px; font-weight: bold; letter-spacing: 2px; }
        .TITRE-RADIO span { color: #66fcf1; }
        .BOUTON-JAUNE-ADMIN { background-color: #ffcc00; color: #0b0c10; border: 2px solid #ffffff; padding: 12px 24px; font-weight: bold; border-radius: 25px; cursor: pointer; text-transform: uppercase; }
        
        .CONTENEUR { padding: 25px; max-width: 580px; margin: 0 auto; }
        .CARTE-STUDIO { background: #1f2833; border: 1px solid #45a29e; border-radius: 20px; padding: 35px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        
        .STATUT-ANTENNE { display: inline-block; background: #252525; color: #aaa; padding: 8px 18px; border-radius: 30px; font-size: 14px; font-weight: bold; margin-bottom: 15px; border: 1px solid #444; }
        .STATUT-ANTENNE.ia-direct { background: #a066ff; color: #ffffff; animation: flash 1s infinite; box-shadow: 0 0 10px rgba(160, 102, 255, 0.5); }
        .COMPTEUR-REEL { background-color: #0b0c10; color: #66fcf1; padding: 12px; border-radius: 10px; font-size: 18px; font-weight: bold; margin: 20px 0; border: 1px solid #45a29e; }
        
        .BARRE-ACTIVATION-SON { background: linear-gradient(90deg, #ffcc00, #ffaa00); color: #000; padding: 16px; font-weight: bold; border-radius: 12px; margin-bottom: 20px; cursor: pointer; display: block; font-size: 14px; width: 100%; border: 3px solid white; animation: pulse 2s infinite; text-transform: uppercase; }
        .BOUTON-PLAY { background: linear-gradient(90deg, #66fcf1, #45a29e); color: #0b0c10; border: none; border-radius: 50px; padding: 16px 35px; font-size: 16px; font-weight: bold; cursor: pointer; display: block; width: 100%; max-width: 320px; margin: 0 auto; text-transform: uppercase; }
        .BOUTON-PLAY.ia-actif { background: linear-gradient(90deg, #a066ff, #66fcf1); color: black; box-shadow: 0 0 20px rgba(160, 102, 255, 0.7); }
        .BOUTON-PLAY:disabled { background: #444 !important; color: #888 !important; cursor: not-allowed; }
        
        .CONTENEUR-VUMETRE { background: #0b0c10; border: 1px solid #444; padding: 10px; border-radius: 8px; margin: 18px 0; text-align: left; }
        .LABEL-VUMETRE { font-size: 11px; color: #aaa; font-weight: bold; margin-bottom: 6px; display: block; }
        .RAIL-VUMETRE { background: #1a1a1a; width: 100%; height: 16px; border-radius: 4px; overflow: hidden; border: 1px solid #333; }
        .BARRE-VOLUME { height: 100%; width: 0%; background: linear-gradient(90deg, #28a745 55%, #ffcc00 80%, #ff3333 100%); transition: width 0.1s ease; }

        .ZONE-CHAT { margin-top: 25px; text-align: left; }
        .CHAT-LIVE { background: #0b0c10; border: 1px solid #45a29e; height: 150px; overflow-y: auto; border-radius: 10px; padding: 12px; font-size: 13px; display: flex; flex-direction: column; gap: 8px; }
        .MESSAGE { background: #1f2833; padding: 8px 12px; border-radius: 8px; border-left: 3px solid #66fcf1; }
        .MESSAGE .PSEUDO { color: #ffcc00; font-weight: bold; margin-right: 5px; }
        .MESSAGE.msg-ia { border-left-color: #a066ff; background: #15102a; }
        .MESSAGE.msg-ia .PSEUDO { color: #a066ff; }
        .BLOC-ENVOI { display: flex; gap: 10px; margin-top: 10px; }
        .INPUT-TEXT { flex: 1; padding: 12px; background: #0b0c10; color: white; border: 1px solid #45a29e; border-radius: 8px; }
        .BOUTON-ENVOYER { background: #66fcf1; color: #0b0c10; border: none; padding: 0 22px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        
        .CARTE-ADMIN { display: none; background: #1f2833; border: 2px solid #ffcc00; border-radius: 20px; padding: 30px; margin-top: 20px; }
        .ACTION-ADMIN { width: 100%; padding: 14px; background: #66fcf1; color: #0b0c10; font-weight: bold; cursor: pointer; border: none; border-radius: 50px; text-transform: uppercase; margin-bottom: 15px; }
        .BOUTON-IA-REEL { background-color: #a066ff; color: white; font-size: 15px; font-weight: bold; padding: 15px; border-radius: 10px; border: 2px solid white; cursor: pointer; width: 100%; text-transform: uppercase; }

        .FOND-POPUP { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); justify-content: center; align-items: center; z-index: 99999; }
        .BOITE-POPUP { background: #1f2833; padding: 30px; border-radius: 15px; border: 2px solid #66fcf1; text-align: center; width: 310px; }
        .ECRAN-CODE { width: 100%; padding: 12px; font-size: 24px; text-align: center; background: #0b0c10; color: #ffcc00; border: 1px solid #45a29e; border-radius: 8px; margin-bottom: 15px; letter-spacing: 6px; font-weight: bold; }

        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="BARRE-HAUT">
        <div class="TITRE-RADIO">🌐 TRANSFR <span>STUDIO</span></div>
        <button class="BOUTON-JAUNE-ADMIN" onclick="ouvrirFenetreCode()">⚙️ Studio Admin</button>
    </div>

    <div class="CONTENEUR">
        <div id="ecranPublic">
            <button id="barreSonClient" class="BARRE-ACTIVATION-SON" onclick="declencherAutorisationAudioInitiale(this)">🔊 ENCLENCHER LE SYSTÈME AUDIO TRANSFR</button>

            <div class="CARTE-STUDIO">
                <div id="badgeDirect" class="STATUT-ANTENNE">⚫ ANTENNE HORS-LIGNE</div>
                <div id="vraiCompteur" class="COMPTEUR-REEL">👥 Connectés : 1 auditeur</div>
                
                <button id="boutonEcouterLive" class="BOUTON-PLAY" disabled onclick="declencherEcouteFluxDirect()">▶️ ÉCOUTER LE LIVE</button>
                <p id="texteAlertePseudo" style="color: #ffcc00; font-size: 12px; margin-top: 8px; font-weight: bold;">⚠️ Crée un compte pseudo ci-dessous pour débloquer le direct</p>
                
                <audio id="lecteurAudioIa" style="display:none;"></audio>

                <div class="CONTENEUR-VUMETRE" id="vumetrePublicConteneur" style="display:none;">
                    <span class="LABEL-VUMETRE">🎚️ RECEPTION SYNCHRO AUDIO (EN DIRECT) :</span>
                    <div class="RAIL-VUMETRE">
                        <div id="vumetrePublic" class="BARRE-VOLUME"></div>
                    </div>
                </div>

                <div class="ZONE-CHAT">
                    <h4 style="margin: 0 0 10px 0; color: #66fcf1; font-size: 14px;">💬 Commentaires du live en temps réel :</h4>
                    <div id="boiteChat" class="CHAT-LIVE"></div>
                    <div class="BLOC-ENVOI">
                        <input type="text" id="inputMessage" class="INPUT-TEXT" placeholder="Tape ton message ici...">
                        <button class="BOUTON-ENVOYER" onclick="envoyerCommentaire()">OK</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="ecranAdmin" class="CARTE-ADMIN">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <h2 style="color:#ffcc00; margin:0; font-size: 20px;">🎛️ CONSOLE TRANSFR MAIN</h2>
                <button onclick="fermerLeStudio()" style="background:#ff3333; color:white; border:none; padding:8px 14px; cursor:pointer; font-weight:bold; border-radius: 5px;">Quitter</button>
            </div>
            <button id="boutonControleIa" class="BOUTON-IA-REEL" onclick="basculerControleIaTransfr()">🤖 Lancer la Playlist Synchrone (IA)</button>
        </div>
    </div>

    <div id="popupPseudo" class="FOND-POPUP" style="display: flex;">
        <div class="BOITE-POPUP">
            <h3 style="color:#66fcf1; margin-top:0; font-size:18px;">👋 REJOINDRE TRANSFR</h3>
            <input type="text" id="inputPseudoCompte" class="INPUT-TEXT" style="width:100%; box-sizing:border-box; margin-bottom:20px; text-align:center; font-weight:bold; color:#ffcc00;" placeholder="Choisis ton Pseudo...">
            <button class="ACTION-ADMIN" onclick="creerCompteAuditeur()">VALIDER ET ENTRER</button>
        </div>
    </div>

    <div id="popupVerrou" class="FOND-POPUP">
        <div class="BOITE-POPUP" style="border-color: #ffcc00;">
            <h3 style="color:#ffcc00; margin-top:0; font-size:16px;">🔒 ACCÈS TRANSFR CONTROL</h3>
            <input type="password" id="ecranSaisieCode" class="ECRAN-CODE" readonly placeholder="••••">
            <input type="text" id="champsClavierCache" placeholder="Saisir le code..." style="background:transparent; color:white; text-align:center; border:1px solid #444; width:100%; padding:12px; border-radius:8px; box-sizing:border-box;" oninput="document.getElementById('ecranSaisieCode').value = this.value;">
            <button class="ACTION-ADMIN" style="margin-top:15px;" onclick="validerCodeStudio()">OUVRIR LE STUDIO</button>
            <button class="ACTION-ADMIN" style="background:#333; color:#aaa; margin-top:8px;" onclick="fermerFenetreCode()">ANNULER</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://transfr-radio-default-rtdb.europe-west1.firebasedatabase.app/" };
        let database;
        try { firebase.initializeApp(firebaseConfig); database = firebase.database(); } catch(e) {}

        let monID = "user_" + Math.floor(Math.random() * 100000);
        let monPseudo = "";
        const CODE_STUDIO_VRAI = "1944"; 
        let statutAntenneActuel = "eteint"; 
        let ecouteEnCours = false;
        let iaIntervalleAudioVumetre = null;

        // Morceaux stables avec leur durée exacte en secondes (Exemple SoundHelix de secours)
        const playlistIA = [
            { id: 0, artiste: "LAKEY INSPIRED", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", duree: 372 },
            { id: 1, artiste: "Tobu", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3", duree: 423 }
        ];

        function declencherAutorisationAudioInitiale(boutonElement) {
            boutonElement.style.display = 'none';
        }

        function creerCompteAuditeur() {
            let p = document.getElementById("inputPseudoCompte").value.trim();
            if(p === "") return alert("Pseudo obligatoire !");
            monPseudo = p;
            document.getElementById("popupPseudo").style.display = "none";
            document.getElementById("boutonEcouterLive").disabled = false;
            document.getElementById("texteAlertePseudo").style.display = "none";
        }

        function ouvrirFenetreCode() {
            document.getElementById("popupVerrou").style.display = "flex";
            document.getElementById("champsClavierCache").value = "";
            document.getElementById("ecranSaisieCode").value = "";
            setTimeout(() => { document.getElementById("champsClavierCache").focus(); }, 120);
        }
        function fermerFenetreCode() { document.getElementById("popupVerrou").style.display = "none"; }

        function validerCodeStudio() {
            if (document.getElementById("champsClavierCache").value === CODE_STUDIO_VRAI) {
                fermerFenetreCode();
                document.getElementById("ecranPublic").style.display = "none";
                document.getElementById("ecranAdmin").style.display = "block";
            } else { alert("Code incorrect."); }
        }

        function fermerLeStudio() {
            document.getElementById("ecranAdmin").style.display = "none";
            document.getElementById("ecranPublic").style.display = "block";
        }

        // DÉMARRAGE DE L'ANTENNE AVEC HORLOGE SYNCHRONISÉE
        function basculerControleIaTransfr() {
            if (statutAntenneActuel !== "ia") {
                let morceauChoisi = playlistIA[Math.floor(Math.random() * playlistIA.length)];
                if(database) {
                    database.ref("radio_synchro").set({
                        statut: "ia",
                        morceauId: morceauChoisi.id,
                        tempsDemarrage: Date.now() // Sauvegarde du moment exact du départ
                    });
                }
            } else {
                if(database) database.ref("radio_synchro").set({ statut: "eteint" });
            }
        }

        // VÉRIFICATION CONSTANTE DE LA SYNCHRONISATION POUR L'AUDITEUR
        function verifierEtAjusterAudioSynchro(donnees) {
            let lecteur = document.getElementById("lecteurAudioIa");
            
            if (donnees.statut === "ia" && ecouteEnCours) {
                let morceau = playlistIA.find(m => m.id === donnees.morceauId);
                if (!morceau) return;

                // Calcul de la seconde exacte où la chanson doit en être
                let tempsEcouleMilli = Date.now() - donnees.tempsDemarrage;
                let secondeAttendue = tempsEcouleMilli / 1000;

                // Si le morceau est fini, l'Admin relance automatiquement un cycle (géré côté lecteur)
                if (secondeAttendue > morceau.duree) {
                    lecteur.pause();
                    return;
                }

                // Si la balise ne joue pas encore la bonne musique
                if (lecteur.src !== morceau.url) {
                    lecteur.src = morceau.url;
                    lecteur.currentTime = secondeAttendue;
                    lecteur.play().catch(e => console.log("Clic requis"));
                } 
                // Sécurité anti-décalage : si l'audio dérive de plus de 2 secondes, on le recale de force !
                else if (Math.abs(lecteur.currentTime - secondeAttendue) > 2) {
                    lecteur.currentTime = secondeAttendue;
                }
            } else {
                lecteur.pause();
            }
        }

        function declencherEcouteFluxDirect() {
            let btnPlay = document.getElementById("boutonEcouterLive");
            if (!ecouteEnCours) {
                ecouteEnCours = true;
                btnPlay.innerText = "🛑 ARRÊTER LE LIVE";
                btnPlay.style.background = "linear-gradient(90deg, #ff3333, #aa0000)";
                btnPlay.style.color = "white";
                
                // Forcer la vérification immédiate
                if(database) {
                    database.ref("radio_synchro").once("value", function(snap) {
                        if(snap.exists()) verifierEtAjusterAudioSynchro(snap.val());
                    });
                }

                iaIntervalleAudioVumetre = setInterval(() => {
                    let barrePublique = document.getElementById("vumetrePublic");
                    if(barrePublique && statutAntenneActuel === "ia") {
                        barrePublique.style.width = (Math.floor(Math.random() * 50) + 30) + "%";
                    }
                }, 100);
            } else {
                ecouteEnCours = false;
                clearInterval(iaIntervalleAudioVumetre);
                document.getElementById("vumetrePublic").style.width = "0%";
                document.getElementById("lecteurAudioIa").pause();
                actualiserDesignBoutonAntenne();
            }
        }

        function actualiserDesignBoutonAntenne() {
            if (ecouteEnCours) return;
            let btnPlay = document.getElementById("boutonEcouterLive");
            if (statutAntenneActuel === "ia") {
                btnPlay.className = "BOUTON-PLAY ia-actif"; btnPlay.innerText = "🎵 ÉCOUTER LE MIX SYNCHRO";
            } else {
                btnPlay.className = "BOUTON-PLAY"; btnPlay.innerText = "▶️ ÉCOUTER LE LIVE";
            }
        }

        function envoyerCommentaire() {
            let msg = document.getElementById("inputMessage").value.trim();
            if(msg === "" || !monPseudo) return;
            if(database) {
                database.ref("commentaires_live").push({ pseudo: monPseudo, texte: msg, timestamp: Date.now() });
                document.getElementById("inputMessage").value = "";
            }
        }

        window.onload = function() {
            if(database) {
                database.ref("auditeurs_en_direct/" + monID).set(true);
                database.ref("auditeurs_en_direct/" + monID).onDisconnect().remove();
                
                database.ref("commentaires_live").limitToLast(35).on("value", function(snap) {
                    let boite = document.getElementById("boiteChat"); boite.innerHTML = "";
                    snap.forEach(function(enfant) {
                        let data = enfant.val();
                        boite.innerHTML += `<div class="MESSAGE"><span class="PSEUDO">${data.pseudo} :</span>${data.texte}</div>`;
                    });
                    boite.scrollTop = boite.scrollHeight;
                });

                // ÉCOUTE DES CHANGEMENTS DE FLUX EN DIRECT
                database.ref("radio_synchro").on("value", function(snap) {
                    let donnees = snap.val() || { statut: "eteint" };
                    statutAntenneActuel = donnees.statut;
                    
                    let badgeAppareil = document.getElementById("badgeDirect");
                    let btnIa = document.getElementById("boutonControleIa");
                    
                    if (statutAntenneActuel === "ia") {
                        badgeAppareil.innerText = "🤖 PLAYLIST SYNCHRONISÉE EN COURS";
                        badgeAppareil.className = "STATUT-ANTENNE ia-direct";
                        document.getElementById("vumetrePublicConteneur").style.display = "block";
                        if(btnIa) {
                            btnIa.innerText = "🛑 ARRÊTER LA PLAYLIST";
                            btnIa.style.background = "#ff3333";
                        }
                        // Lancement ou recalage de l'audio
                        verifierEtAjusterAudioSynchro(donnees);
                    } else {
                        badgeAppareil.innerText = "⚫ ANTENNE HORS-LIGNE";
                        badgeAppareil.className = "STATUT-ANTENNE";
                        document.getElementById("vumetrePublicConteneur").style.display = "none";
                        if(btnIa) {
                            btnIa.innerText = "🤖 Lancer la Playlist Synchrone (IA)";
                            btnIa.style.background = "#a066ff";
                        }
                        document.getElementById("lecteurAudioIa").pause();
                    }
                    actualiserDesignBoutonAntenne();
                });
            }
        };
    </script>
</body>
</html>
