<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfr Radio - Dashboard Admin</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: "Roboto", Arial, sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
        }

        /* HEADER */
        .radio-header {
            background-color: #161616; padding: 15px 20px;
            display: flex; align-items: center; justify-content: space-between;
            position: fixed; top: 0; width: 100%; box-sizing: border-box;
            border-bottom: 2px solid #00bcd4; z-index: 1000;
        }
        .radio-title { font-weight: bold; font-size: 22px; letter-spacing: 1px; color: #fff; }
        .radio-title span { color: #00bcd4; }

        .container {
            margin-top: 80px; margin-bottom: 40px; padding: 20px;
            width: 100%; max-width: 600px; box-sizing: border-box;
        }

        /* ZONE ADMIN LOOK STUDIO */
        .admin-card {
            background: linear-gradient(145deg, #161616, #212121);
            border-radius: 16px; padding: 25px;
            border: 1px solid #2f2f2f; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        h2 { margin-top: 0; font-size: 20px; color: #00bcd4; display: flex; align-items: center; gap: 10px; }
        
        .section-title {
            font-size: 12px; color: #aaa; text-transform: uppercase;
            font-weight: bold; margin-top: 20px; margin-bottom: 10px;
            letter-spacing: 0.5px; border-bottom: 1px solid #333; padding-bottom: 5px;
        }

        /* GRILLE DE STATUS */
        .status-grid {
            display: flex; gap: 15px; margin-bottom: 20px;
        }
        .status-box {
            flex: 1; background-color: #0f0f0f; padding: 15px; border-radius: 10px;
            border: 1px solid #3f3f3f; text-align: center;
        }
        .status-box .label { font-size: 11px; color: #aaa; margin-bottom: 5px; }
        .status-box .value { font-size: 16px; font-weight: bold; }
        
        /* COULEURS DES BADGES STATUS */
        .status-public { color: #00ff66; }
        .status-prive { color: #ff3333; }

        /* BOUTONS DE SÉLECTION DU MODE */
        .mode-container {
            display: flex; gap: 10px; margin-bottom: 15px;
        }
        .mode-btn {
            flex: 1; padding: 12px; border: 1px solid #3f3f3f; border-radius: 8px;
            font-weight: bold; cursor: pointer; font-size: 14px; background-color: #272727; color: white;
            transition: all 0.3s ease;
        }
        .mode-btn.active-public { background-color: #00ff66; color: #0f0f0f; border: none; box-shadow: 0 0 10px rgba(0,255,102,0.3); }
        .mode-btn.active-prive { background-color: #ff3333; color: white; border: none; box-shadow: 0 0 10px rgba(255,51,51,0.3); }

        /* INPUTS */
        input[type="text"], input[type="password"], select {
            width: 100%; background-color: #0f0f0f; border: 1px solid #3f3f3f;
            border-radius: 8px; padding: 12px; color: white; box-sizing: border-box;
            margin-bottom: 15px; outline: none; font-size: 14px; transition: border 0.3s;
        }
        input:focus { border-color: #00bcd4; }

        .btn-action {
            background-color: #00bcd4; color: #0f0f0f; border: none; border-radius: 25px;
            padding: 14px; font-weight: bold; cursor: pointer; width: 100%; font-size: 15px;
            box-shadow: 0 4px 15px rgba(0,188,212,0.3); transition: transform 0.2s;
        }
        .btn-action:active { transform: scale(0.98); }

        /* CONTRÔLES AUDIO SIMULÉS */
        .audio-rack {
            background-color: #0f0f0f; border: 1px solid #333; border-radius: 8px;
            padding: 15px; margin-top: 15px;
        }
        .slider-group { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .slider-group label { font-size: 13px; color: #ccc; }
        .slider-group input[type="range"] { accent-color: #00bcd4; width: 60%; }
    </style>
</head>
