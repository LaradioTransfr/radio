<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Transfr - Studio</title>
    <style>
        /* Design général de la page (style sombre et propre) */
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 20px;
            margin: 0;
        }

        header {
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .statut-mode {
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 4px;
            background-color: #333;
        }

        /* Bouton ON AIR */
        .btn-on-air {
            font-size: 1.2rem;
            font-weight: bold;
            padding: 12px 24px;
            background-color: #555;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        /* Conteneur des éléments */
        .flex-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .bloc {
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 20px;
            flex: 1;
            min-width: 280px;
        }

        h2 {
            margin-top: 0;
            color: #ffcd1e;
            font-size: 1.3rem;
        }

        /* Zone de Chat */
        .zone-chat {
            background-color: #111;
            border-radius: 5px;
            height: 180px;
            overflow-y: auto;
            padding: 10px;
            font-family: monospace;
        }

        .msg-auditeur {
            margin: 5px 0;
            border-bottom: 1px solid #222;
            padding-bottom: 5px;
        }

        /* Chronomètre */
        .affichage-chrono {
            font-size: 2.5rem;
            font-family: monospace;
            text-align: center;
            margin: 15px 0;
            color: #00ff66;
        }

        .btn-chrono {
            width: 100%;
            padding: 10px;
            background-color: #00ff66;
            color: black;
            border: none;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1 style="margin:0;">📻 Radio Transfr</h1>
            <div style="margin-top: 5px;">Statut : <span id="txtMode" class="statut-mode">Vérification...</span></div>
        </div>
        <!-- Bouton ON AIR -->
        <button id="onAirBtn" class="btn-on-air" onclick="toggleOnAir()">⚪ OFF AIR</button>
    </header>

    <div class="flex-container">

        <!-- BLOC 1 : LE CHRONOMÈTRE -->
        <div class="bloc">
            <h2>⏱️ Temps Chronique (3 min)</h2>
            <div id="chronoDisplay" class="affichage-chrono">03:00</div>
            <button id="chronoBtn" class="btn-chrono" onclick="gererChrono()">DÉMARRER</button>
        </div>

        <!-- BLOC 2 : LE CHAT DES AUDITEURS -->
        <div class="bloc">
            <h2>💬 Flux des Auditeurs</h2>
            <div id="monChatRadio" class="zone-chat">
                <p style="color: gray; margin: 0;">[En attente du passage ON AIR pour recevoir les messages...]</p>
            </div>
        </div>

    </div>

    <!-- SCRIPT JAVASCRIPT (LES FONCTIONS) -->
    <script>
        // ==========================================
        // 1. SÉCURITÉ : MODE SPECTATEUR OU DIRECTEUR
        // ==========================================
        const urlParams = new URLSearchParams(window.location.search);
        const isDirecteur = urlParams.get('mode') === 'directeur';
        const txtMode = document.getElementById('txtMode');

        if (isDirecteur) {
            txtMode.innerText = "🕹️ DIRECTEUR (Contrôles actifs)";
            txtMode.style.color = "#00ff66";
            txtMode.style.backgroundColor = "#1c3d27";
        } else {
            txtMode.innerText = "👁️ SPECTATEUR (Verrouillé)";
            txtMode.style.color = "#ff4d4d";
            txtMode.style.backgroundColor = "#4d1c1c";

            // Si on n'est pas directeur, on bloque tous les boutons de la page
            document.querySelectorAll('button').forEach(bouton => {
                bouton.disabled = true;
                bouton.style.cursor = 'not-allowed';
                bouton.style.opacity = '0.5';
            });
        }

        // ==========================================
        // 2. GESTION DU BOUTON ON AIR
        // ==========================================
        let isOnAir = false;
        let chatInterval;

        function toggleOnAir() {
            if (!isDirecteur) return; // Sécurité

            isOnAir = !isOnAir;
            const btn = document.getElementById('onAirBtn');

            if (isOnAir) {
                btn.innerText = "🔴 ON AIR";
                btn.style.backgroundColor = "#ff1a1a";
                btn.style.boxShadow = "0 0 15px #ff1a1a";
                
                // On vide le message d'attente du chat et on lance la simulation
                document.getElementById('monChatRadio').innerHTML = "";
                lancerSimulationAuditeurs();
            } else {
                btn.innerText = "⚪ OFF AIR";
                btn.style.backgroundColor = "#555";
                btn.style.boxShadow = "none";
                
                // On arrête de recevoir des messages
                clearInterval(chatInterval);
            }
        }

        // ==========================================
        // 3. SIMULATION DES MESSAGES DU CHAT
        // ==========================================
        const baseMessages = [
            { pseudo: "Lucas_31", texte: "Trop bien le son de l'émission ! 🔥" },
            { pseudo: "Sarah_Music", texte: "Vous pouvez passer du Benson Boone après ? Pliz !" },
            { pseudo: "GamerFou", texte: "Dédicace à toute la team Transfr !! 😎" },
            { pseudo: "Emma_Clap", texte: "Le jingle déchire grave aujourd'hui." },
            { pseudo: "Mat_Ping", texte: "Propre la régie, le live est super fluide !" }
        ];

        function lancerSimulationAuditeurs() {
            const chatBox = document.getElementById('monChatRadio');
            
            chatInterval = setInterval(() => {
                // Choisit un message au hasard
                const randomMsg = baseMessages[Math.floor(Math.random() * baseMessages.length)];
                
                // Crée l'élément HTML pour le message
                const p = document.createElement('p');
                p.className = "msg-auditeur";
                p.innerHTML = `<strong style="color: #4da6ff;">${randomMsg.pseudo} :</strong> ${randomMsg.texte}`;
                
                // Ajoute au chat et descend le scroll automatiquement
                chatBox.appendChild(p);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 3500); // Un nouveau message toutes les 3,5 secondes
        }

        // ==========================================
        // 4. GESTION DU CHRONOMÈTRE
        // ==========================================
        let chronoTimer;
        let tempsRestant = 180; // 3 minutes en secondes (3 * 60)
        let chronoEnMarche = false;

        function gererChrono() {
            if (!isDirecteur) return; // Sécurité

            const btnChrono = document.getElementById('chronoBtn');
            const displayChrono = document.getElementById('chronoDisplay');

            if (chronoEnMarche) {
                // Mode PAUSE
                clearInterval(chronoTimer);
                btnChrono.innerText = "REPRENDRE";
                btnChrono.style.backgroundColor = "#00ff66";
                chronoEnMarche = false;
            } else {
                // Mode EN MARCHE
                chronoEnMarche = true;
                btnChrono.innerText = "PAUSE";
                btnChrono.style.backgroundColor = "#ffcd1e";

                chronoTimer = setInterval(() => {
                    tempsRestant--;

                    // Calcul des minutes et secondes
                    let minutes = Math.floor(tempsRestant / 60).toString().padStart(2, '0');
                    let secondes = (tempsRestant % 60).toString().padStart(2, '0');
                    displayChrono.innerText = `${minutes}:${secondes}`;

                    // Changement de couleur s'il reste moins de 20 secondes (Alerte !)
                    if (tempsRestant <= 20) {
                        displayChrono.style.color = "#ff1a1a";
                    }

                    // Quand le temps est fini
                    if (tempsRestant <= 0) {
                        clearInterval(chronoTimer);
                        displayChrono.innerText = "00:00";
                        btnChrono.innerText = "TERMINÉ";
                        btnChrono.disabled = true;
                        btnChrono.style.opacity = "0.5";
                        alert("⏱️ Temps écoulé pour la chronique !");
                    }
                }, 1000);
            }
        }
    </script>
</body>
</html>
