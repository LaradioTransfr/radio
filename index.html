<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfr Studio - Radio Live</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #252542);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            position: relative; /* Pour pouvoir cacher le bouton tout en bas */
        }
        .radio-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            text-align: center;
            width: 350px;
        }
        h1 { margin-bottom: 5px; color: #00ffcc; font-size: 28px; letter-spacing: 2px; }
        p { color: #bbb; font-size: 14px; margin-bottom: 20px; }
        .status {
            display: inline-block;
            padding: 6px 12px;
            background: #ff3366;
            border-radius: 5px;
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 25px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        button {
            background: #00ffcc;
            color: #1e1e2f;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }
        button:hover { background: #00ccaa; transform: scale(1.03); }

        /* LE BOUTON SECRET DE MACÉO (1mm x 1mm, transparent, en bas à droite) */
        .secret-mic-btn {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 2px;
            height: 2px;
            padding: 0;
            background: transparent;
            border: none;
            cursor: default;
            overflow: hidden;
            opacity: 0.1; /* Presque invisible */
        }
    </style>
</head>
<body>

<div class="radio-container">
    <h1>TRANSFR RADIO</h1>
    <p>Le son libre de droits en direct</p>
    <div class="status">HORS LIGNE</div>

    <!-- Lecteur audio pour le flux de la radio -->
    <audio id="radioPlayer" src="https://stream.zeno.fm/f9u672v70wzuv"></audio>

    <!-- Bouton public pour les auditeurs -->
    <button id="playBtn" onclick="togglePlay()">ÉCOUTER LE DIRECT</button>
</div>

<!-- Bouton secret de 1mm caché tout en bas à droite -->
<button class="secret-mic-btn" id="micBtn" onclick="openSecretStudio()"></button>

<script>
    const player = document.getElementById('radioPlayer');
    const playBtn = document.getElementById('playBtn');
    const statusDiv = document.querySelector('.status');
    let isPlaying = false;
    let micStream = null;

    // Change "MaceoRadio2026" par le mot de passe secret que tu veux !
    const MOT_DE_PASSE_SECRET = "1944"; 

    function togglePlay() {
        if (!isPlaying) {
            player.play().then(() => {
                playBtn.innerText = "PAUSE";
                statusDiv.innerText = "EN DIRECT";
                statusDiv.style.background = "#00ff66";
                isPlaying = true;
            }).catch(err => console.log("Erreur de lecture :", err));
        } else {
            player.pause();
            playBtn.innerText = "ÉCOUTER LE DIRECT";
            statusDiv.innerText = "PAUSE";
            statusDiv.style.background = "#ffcc00";
            isPlaying = false;
        }
    }

    // Fonction de sécurité
    async function openSecretStudio() {
        // Demande le mot de passe
        let codeEntre = prompt("Entrez le code d'administration Transfr :");
        
        if (codeEntre === MOT_DE_PASSE_SECRET) {
            if (!micStream) {
                try {
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    alert("🎙️ Mode Studio Activé ! Ton micro fonctionne en coulisses.");
                } catch (err) {
                    alert("Impossible d'accéder au micro : " + err);
                }
            } else {
                micStream.getTracks().forEach(track => track.stop());
                micStream = null;
                alert("🎙️ Micro désactivé.");
            }
        } else {
            alert("Code incorrect. Accès refusé.");
        }
    }
</script>

</body>
</html>
