<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Radio Transfr</title>
    <style>
        body { background: #0c0c14; color: white; font-family: sans-serif; padding: 20px; }
        .box { background: #14141f; padding: 20px; border-radius: 12px; border: 1px solid #2d2d44; margin-bottom: 20px; }
        .live-banner { background: #14141f; border: 1px solid #00d2ff; padding: 15px; border-radius: 12px; text-align: center; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>

    <!-- Bandeau Live -->
    <div class="live-banner">
        Prochain Direct : <span id="affichage-heure-live">À venir</span>
    </div>

    <!-- Console Admin -->
    <div id="panneau-admin" class="box" style="display: none;">
        <h3>Console Admin</h3>
        <input type="text" id="input-heure" placeholder="Heure du live...">
        <button onclick="majHeure()">Mettre à jour l'heure</button>
        <br><br>
        <input type="text" id="pseudo-points" placeholder="Pseudo...">
        <button onclick="ajouterPoints()">Ajouter 50 points</button>
    </div>

    <button onclick="document.getElementById('panneau-admin').style.display = 'block'">Admin</button>

    <script>
        // Charger l'heure et les points au démarrage
        window.onload = function() {
            document.getElementById('affichage-heure-live').innerText = localStorage.getItem('transfr-live') || "À venir";
        };

        // Mettre à jour l'heure
        function majHeure() {
            let heure = document.getElementById('input-heure').value;
            localStorage.setItem('transfr-live', heure);
            document.getElementById('affichage-heure-live').innerText = heure;
        }

        // Ajouter des points
        function ajouterPoints() {
            let pseudo = document.getElementById('pseudo-points').value.toLowerCase();
            let comptes = JSON.parse(localStorage.getItem('transfr-comptes') || '{}');
            
            if(comptes[pseudo]) {
                comptes[pseudo].points = (comptes[pseudo].points || 0) + 50;
                localStorage.setItem('transfr-comptes', JSON.stringify(comptes));
                alert("50 points ajoutés à " + pseudo);
            } else {
                alert("Compte inconnu !");
            }
        }
    </script>
</body>
</html>
