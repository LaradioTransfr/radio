<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Transfr</title>
    <style>
        /* DESIGN D'ORIGINE DE TA RADIO */
        body {
            background-color: #111625;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            background-color: #1a2035;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        .header-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .header-title {
            color: #00bcd4;
            font-size: 26px;
            margin: 10px 0;
        }

        .status-badge {
            background-color: #707a9e;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            font-weight: bold;
        }

        .box-style {
            background-color: #111625;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #252d4a;
            margin-bottom: 20px;
        }

        .cyan-button {
            background-color: #00bcd4;
            color: #111625;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            transition: background 0.2s;
        }

        .cyan-button:hover { background-color: #0097a7; }

        /* PANNEAU ADMIN MASQUÉ PAR DÉFAUT */
        #adminPanel {
            display: none;
            border: 2px dashed #ff4444;
        }

        .btn-record {
            background-color: #ff4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            font-size: 22px;
            cursor: pointer;
            display: block;
            margin: 10px auto 0 auto;
        }

        .btn-record.recording {
            background-color: #aa0000;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* SECTION COMMUNAUTÉ : RÉSEAU & SHORTS ENSEMBLE */
        .input-social, .textarea-social {
            width: 100%;
            background-color: #0b0e19;
            border: 1px solid #252d4a;
            border-radius: 8px;
            padding: 10px;
            color: white;
            box-sizing: border-box;
            margin-bottom: 10px;
            outline: none;
        }

        .feed-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 15px;
        }

        .post-card {
            background-color: #252d4a;
            border-radius: 12px;
            padding: 12px;
            border-left: 4px solid #00bcd4;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 177.77%; /* Format vertical 9:16 Shorts */
            height: 0;
            margin-top: 10px;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        /* ENREGISTREUR EN BAS */
        .recording-section {
            position: fixed;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            width: 90%; max-width: 420px;
            background-color: #1a2035;
            border: 2px solid #00bcd4;
            border-radius: 12px;
            padding: 15px;
            z-index: 99999;
            box-shadow: 0px -4px 25px rgba(0, 0, 0, 0.6);
            display: none;
            text-align: center;
        }

        audio { width: 100%; margin-top: 5px; }
    </style>
</head>
<body>

        <div class="header-section">
            <h1 class="header-title">📻 RADIO TRANSFR</h1>
            <div id="statusBadge" class="status-badge">⚪ Studio Hors Ligne</div>
            <button onclick="ouvrirAdmin()" style="background: none; border: none; color: #707a9e; font-size: 11px; cursor: pointer; display: block; margin: 5px auto 0 auto;">🔑 Connexion Admin</button>
        </div>

        <div id="adminPanel" class="box-style">
            <h3 style="margin:0 0 10px 0; color:#ff4444; text-align:center;">🛠️ STUDIO ADMIN SECRETS</h3>
            <button class="cyan-button" style="background-color:#ff4444; color:white; margin-bottom:15px;" onclick="toggleLive()">⚡ ALLUMER / ÉTEINDRE LE LIVE</button>
            
            <div style="text-align: center; border-top: 1px solid #252d4a; padding-top: 10px;">

        </div>

                <audio src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" controls style="margin-top:5px;"></audio>
            </div>
        </div>

        <div class="box-style">

            <p style="font-size:12px; color:#707a9e; margin:0 0 10px 0;">Poste un message ou ajoute un Short YouTube !</p>
            
            <input type="text" id="usernameInput" class="input-social" placeholder="Ton pseudo...">
            <textarea id="postInput" class="textarea-social" placeholder="Écris ton message ici..." rows="2"></textarea>
            <input type="text" id="videoUrl" class="input-social" placeholder="Optionnel : Colle un lien YouTube / Shorts...">
            
            <button class="cyan-button" onclick="publierTout()">🚀 Publier sur le fil</button>

            <div id="mainFeed" class="feed-box">
                </div>
        </div>

    </div>
