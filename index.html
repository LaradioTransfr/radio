<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Transfr</title>
    <style>
        body {
            background-color: #111625; /* Le beau bleu très foncé de ton fond */
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .main-container {
            background-color: #1a2035; /* La couleur des blocs de ta photo */
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 450px; /* Pile la bonne taille pour les téléphones */
            box-shadow: 0px 4px 15px rgba(0,0,0,0.3);
        }

        .header-section {
            text-align: center;
            margin-bottom: 15px;
        }

        .header-title {
            color: #00bcd4; /* Le beau cyan de Transfr */
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 1px;
            margin: 5px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .status-badge {
            background-color: #2c241c;
            color: #ff9800;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            display: inline-block;
            margin: 10px 0;
        }

        /* SECTION LIVE EN DIRECT */
        .live-section {
            background-color: #111625;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #252d4a;
        }

        .live-title {
            color: #ff4444;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .live-player {
            width: 100%;
            margin-top: 5px;
        }

        /* SECTION TCHAT */
        .chat-section {
            background-color: #111625;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #252d4a;
        }

        .section-title {
            color: #00bcd4;
            font-weight: bold;
            margin-bottom: 12px;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-box {
            background-color: #0b0e19;
            border: 1px solid #252d4a;
            border-radius: 8px;
            height: 120px;
            padding: 10px;
            color: #707a9e;
            font-style: italic;
            font-size: 14px;
            margin-bottom: 10px;
            overflow-y: auto;
        }

        .input-box {
            width: 100%;
            background-color: #0b0e19;
            border: 1px solid #252d4a;
            border-radius: 8px;
            padding: 10px;
            color: #ffffff;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .cyan-button {
            background-color: #00bcd4;
            color: #111625;
            border: none;
            border-radius: 8px;
            width: 100%;
            padding: 12px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* SECTION PODCASTS (Infinités de podcasts !) */
        .podcasts-section {
            background-color: #111625;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #252d4a;
        }

        .podcasts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); /* Aligne auto même s'il y en a plein */
            gap: 15px;
            margin-top: 10px;
        }

        .podcast-item {
            text-align: center;
            cursor: pointer;
        }

        .podcast-icon {
            background-color: #252d4a;
            width: 60px;
            height: 60px;
            border-radius: 12px;
            margin: 0 auto 6px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: transform 0.2s;
        }

        .podcast-icon:hover {
            transform: scale(1.1);
            background-color: #00bcd4;
        }

        .podcast-name {
            font-size: 11px;
            color: #a0aec0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ZONE ADMIN */
        .admin-section {
            border: 2px dashed #00bcd4;
            border-radius: 12px;
            padding: 15px;
            background-color: #111625;
            margin-bottom: 15px;
        }

        .privacy-link {
            text-align: center;
            font-size: 12px;
            margin-top: 15px;
        }

        .privacy-link a {
            color: #707a9e;
            text-decoration: none;
        }

        .privacy-link a:hover {
            color: #00bcd4;
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <div class="header-section">
            <h1 class="header-title">📻 RADIO TRANSFR</h1>
            <div class="status-badge">👥 Connecté au réseau Transfr</div>
        </div>

        <div class="live-section">
            <div class="live-title">🔴 LE LIVE EN DIRECT</div>
            <audio controls class="live-player">
                <source src="URL_DE_TON_FLUX_DE_STREAMING" type="audio/mpeg">
                Ton navigateur ne supporte pas le lecteur audio.
            </audio>
        </div>

        <div class="chat-section">
            <div class="section-title">💬 Tchat en direct</div>
            <div class="chat-box">Inscris-toi pour tchater...</div>
            <input type="text" class="input-box" placeholder="Écris ton message ici...">
            <button class="cyan-button">📩 Envoyer au Studio</button>
        </div>

        <div class="podcasts-section">
            <div class="section-title">🎧 Émissions & Podcasts Transfr</div>
            <div class="podcasts-grid">
                
                <div class="podcast-item">
                    <div class="podcast-icon">🎵</div>
                    <div class="podcast-name">Émission 1</div>
                </div>

                <div class="podcast-item">
                    <div class="podcast-icon">🔥</div>
                    <div class="podcast-name">Podcast 1</div>
                </div>

                <div class="podcast-item">
                    <div class="podcast-icon">🎧</div>
                    <div class="podcast-name">Émission 2</div>
                </div>

                <div class="podcast-item">
                    <div class="podcast-icon">🚀</div>
                    <div class="podcast-name">Podcast 2</div>
                </div>

                <div class="podcast-item">
                    <div class="podcast-icon">📻</div>
                    <div class="podcast-name">Émission 3</div>
                </div>

            </div>
        </div>

        <div class="admin-section">
            <div class="section-title">🔑 Zone Admin</div>
            <button class="cyan-button" style="background-color: #252d4a; color: #00bcd4; border: 1px solid #00bcd4;">
                🔒 Connexion Administration
            </button>
        </div>

        <div class="privacy-link">
            <a href="confidentialite.html">Politique de confidentialité</a>
        </div>

    </div>

</body>
</html>
