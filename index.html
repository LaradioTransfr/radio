<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfr Studio</title>
    <style>
        /* Design sombre, épuré et super fluide sur téléphone */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 15px;
            text-align: center;
            transition: background-color 0.2s; /* Pour le flash de censure */
        }

        h1 {
            margin: 5px 0;
            font-size: 1.6rem;
        }

        .info-bar {
            font-size: 0.9rem;
            color: #aaaaaa;
            margin-bottom: 20px;
        }

        /* Boutons simples et tactiles pour le téléphone */
        .btn {
            background-color: #222222;
            color: white;
            border: 2px solid #444444;
            padding: 12px 20px;
            margin: 5px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: inline-block;
        }

        /* Couleurs des boutons quand ils sont actifs */
        #onAirBtn.active {
            background-color: #ff3333;
            border-color: #ff3333;
            box-shadow: 0 0 10px #ff3333;
        }

        #censureBtn {
            background-color: #3a1515;
            border-color: #662222;
        }

        /* Zone de texte minuscule et discrète pour le chat en bas */
        .mini-chat {
            margin-top: 25px;
            padding: 10px;
            background-color: #1a1a1a;
            border-radius: 6px;
            font-size: 0.85rem;
            text-align: left;
            max-height: 120px;
            overflow-y: auto;
        }

        .msg {
            margin: 4px 0;
            border-bottom: 1px solid #252525;
            padding-bottom: 4px;
        }
    </style>
</head>
<body>

    <!-- TITRE ET INFOS DISCRETES -->
    <h1>📻 Transfr Studio</h1>
    <div class="info-bar">
        <span id="txtMode">Vérification...</span> | 
        👥 Auditeurs : <strong id="nbAuditeurs" style="color: #00ff66;">0</strong>
    </div>

    <!-- TOUS LES BOUTONS SUR UNE SEULE LIGNE (PAS DE BLOCS) -->
    <button id="onAirBtn" class="btn" onclick="toggleOnAir()">⚪ OFF AIR</button>
    <button id="chronoBtn" class="btn" onclick="gererChrono()">⏱️ CHRONO (<span id="txtChrono">03:00</span>)</button>
    <button id="censureBtn" class="btn" onclick="declencherCensure()">🤬 BIP</button>

    <!-- LE FLUX DISCRET TOUT EN BAS -->
    <div id="monChatRadio" class="mini-chat">
        <span style="color: gray;">[En attente du direct...]</span>
    </div>

    <script>
        // --- 1. DETECTION DU MODE (URL) ---
        const urlParams = new URLSearchParams(window.location.search);
        const isDirecteur = urlParams.get('mode') === 'directeur';
        const txtMode = document.getElementById('txtMode');

        if (isDirecteur) {
            txtMode.innerText = "🕹️ Mode Directeur";
            txtMode.style.color = "#00ff66";
            document.getElementById('nbAuditeurs').innerText = "14";
        } else {
            txtMode.innerText = "👁️ Mode Spectateur";
            txtMode.style.color = "#ff4d4d";
            // Bloque les clics accidentels sur téléphone si on n'est pas directeur
            document.querySelectorAll('.btn').forEach(btn => btn.disabled = true);
        }

        // --- 2. BOUTON ON AIR ---
        let isOnAir = false;
        let chatInterval;
        let auditeursInterval;

        function toggleOnAir() {
            if (!isDirecteur) return;
            isOnAir = !isOnAir;
            const btn = document.getElementById('onAirBtn');

            if (isOnAir) {
                btn.innerText = "🔴 ON AIR";
                btn.classList.add('active');
                document.getElementById('monChatRadio').innerHTML = "";
                lancerChatEtAuditeurs();
            } else {
                btn.innerText = "⚪ OFF AIR";
                btn.classList.remove('active');
                clearInterval(chatInterval);
                clearInterval(auditeursInterval);
                document.getElementById('nbAuditeurs').innerText = "0";
            }
        }

        // --- 3. CLIGNOTEMENT & BIP CENSURE ---
        function declencherCensure() {
            if (!isDirecteur || !isOnAir) return;

            // Micro-bip audio électronique
            let ctx = new (window.AudioContext || window.webkitAudioContext)();
            let osc = ctx.createOscillator();
            osc.frequency.value = 1000;
            osc.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.25);

            // Flash rouge ultra rapide sur tout le téléphone
            document.body.style.backgroundColor = "#b30000";
            setTimeout(() => {
                document.body.style.backgroundColor = "#121212";
            }, 250);
        }

        // --- 4. CHRONO SANS GROS RECTANGLE ---
        let chronoTimer;
        let tempsRestant = 180;
        let chronoEnMarche = false;

        function gererChrono() {
            if (!isDirecteur) return;
            const btn = document.getElementById('chronoBtn');
            const txt = document.getElementById('txtChrono');

            if (chronoEnMarche) {
                clearInterval(chronoTimer);
                btn.style.borderColor = "#444";
                chronoEnMarche = false;
            } else {
                chronoEnMarche = true;
                btn.style.borderColor = "#ffcd1e";

                chronoTimer = setInterval(() => {
                    tempsRestant--;
                    let mins = Math.floor(tempsRestant / 60).toString().padStart(2, '0');
                    let secs = (tempsRestant % 60).toString().padStart(2, '0');
                    txt.innerText = `${mins}:${secs}`;

                    if (tempsRestant <= 15) txt.style.color = "#ff3333"; // Alerte rouge

                    if (tempsRestant <= 0) {
                        clearInterval(chronoTimer);
                        alert("⏱️ Temps écoulé !");
                    }
                }, 1000);
            }
        }

        // --- 5. SIMULATION FLUX ET AUDITEURS ---
        const messages = [
            { u: "Lucas_31", m: "Trop bien le son ! 🔥" },
            { u: "Sarah_M", m: "Tu passes du Benson Boone après ? 😍" },
            { u: "GamerFou", m: "Dédicace à la team Transfr ! 😎" },
            { u: "Mat_Ping", m: "Le live est super fluide sur mobile" }
        ];

        function lancerChatEtAuditeurs() {
            const chatBox = document.getElementById('monChatRadio');
            
            // Les messages défilent discrètement
            chatInterval = setInterval(() => {
                let r = messages[Math.floor(Math.random() * messages.length)];
                let p = document.createElement('div');
                p.className = "msg";
                p.innerHTML = `<strong style="color:#4da6ff;">${r.u} :</strong> ${r.m}`;
                chatBox.appendChild(p);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 4000);

            // Le compteur d'auditeurs bouge tout seul
            auditeursInterval = setInterval(() => {
                document.getElementById('nbAuditeurs').innerText = Math.floor(Math.random() * (45 - 15 + 1)) + 15;
            }, 6000);
        }
    </script>
</body>
</html>
