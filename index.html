<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Transfr - Studio Expert Pro</title>
    <style>
        body { background-color: #0c0c1e; color: #ffffff; font-family: sans-serif; margin: 0; padding: 20px; }
        .zone-box { border: 1px solid #2d2d44; padding: 20px; border-radius: 12px; margin-bottom: 20px; background-color: #161625; }
        .panneau-admin { display: none; border: 2px solid #9b59b6; padding: 20px; border-radius: 12px; margin-top: 20px; background-color: #161625; }
        .timer { font-size: 24px; font-weight: bold; color: #ff4757; text-align: center; padding: 15px; border: 1px solid #ff4757; border-radius: 12px; background-color: #161625; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div style="text-align: right;">
        <span onclick="ouvrirConnexion()" style="cursor: pointer; text-decoration: underline; color: #aaa;">[ Zone Admin ]</span>
    </div>

    <h1>📻 RADIO TRANSFR</h1>

    <div class="zone-box">
        <h3>👤 COMPTE AUDITEUR</h3>
        <input type="text" id="inscription-pseudo" placeholder="Pseudo...">
        <button onclick="creerCompte()" style="background: #2ed573; color: white; border:none; padding:10px; border-radius:6px;">S'inscrire</button>
        <button onclick="seConnecterAuditeur()" style="background: #00d2ff; color: #0c0c1e; border:none; padding:10px; border-radius:6px;">Se connecter</button>
        <div id="bloc-profil-actif" style="display: none; margin-top: 10px;">
            <p>Profil : <strong id="profil-pseudo" style="color: #00d2ff;"></strong></p>
            <button onclick="deconnexionAuditeur()" style="background: #ff4757; color: white; border:none; padding:5px;">Déconnexion</button>
        </div>
    </div>

    <div class="timer">
        🚀 PROCHAIN LIVE : <span id="affichage-timer">Chargement...</span>
    </div>

    <div class="zone-box" style="text-align: center;">
        <h3>🎶 LECTEUR RADIO</h3>
        <audio id="lecteur-radio" controls style="width: 100%; max-width: 400px; margin-top: 10px;">
            <source src="https://stream.radio.co/s12345/listen" type="audio/mpeg">
            Votre navigateur ne supporte pas l'audio.
        </audio>
    </div>

    <div id="panneau-admin" class="panneau-admin">
        <h3>🛠️ CONSOLE DIRECTEUR</h3>
        <button id="btn-lancer-live" style="padding: 20px; width: 100%; font-weight: bold; background: #2ed573; color: white; border:none;">🔴 ALLUMER LE MICRO / LANCER LE DIRECT</button>
    </div>

    <div id="zone-connexion" style="display: none; position: fixed; top: 30%; left: 40%; background: #1e1e2f; padding: 20px; border: 2px solid #00d2ff; border-radius: 12px;">
        <input type="password" id="code-secret" placeholder="Code secret...">
        <button onclick="verifierCode()">Valider</button>
    </div>

    <script>
        const dateDebut = new Date(2026, 4, 25, 18, 0, 0);
        let compteActuel = null;

        function updateTimer() {
            const diff = dateDebut - new Date();
            if (diff <= 0) { document.getElementById('affichage-timer').innerText = "🔴 EN DIRECT !"; return; }
            const j = Math.floor(diff / (1000*60*60*24));
            const h = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
            document.getElementById('affichage-timer').innerText = j + "j " + h + "h";
        }
        setInterval(updateTimer, 1000);
        updateTimer();

        // Gestion Audio
        const audio = document.getElementById('lecteur-radio');
        document.getElementById('btn-lancer-live').addEventListener('click', function() {
            if (this.innerText.includes("ALLUMER")) {
                this.style.backgroundColor = "#ff4757";
                this.innerText = "⏹️ ARRÊTER LE DIRECT";
                audio.play();
            } else {
                this.style.backgroundColor = "#2ed573";
                this.innerText = "🔴 ALLUMER LE MICRO / LANCER LE DIRECT";
                audio.pause();
            }
        });

        function creerCompte() {
            const p = document.getElementById('inscription-pseudo').value.trim();
            if(!p) return;
            compteActuel = { pseudo: p };
            localStorage.setItem('transfr-user', JSON.stringify(compteActuel));
            document.getElementById('bloc-profil-actif').style.display = 'block';
            document.getElementById('profil-pseudo').innerText = p;
        }

        function seConnecterAuditeur() {
            const saved = localStorage.getItem('transfr-user');
            if(saved) {
                compteActuel = JSON.parse(saved);
                document.getElementById('bloc-profil-actif').style.display = 'block';
                document.getElementById('profil-pseudo').innerText = compteActuel.pseudo;
            }
        }

        function deconnexionAuditeur() {
            localStorage.removeItem('transfr-user');
            location.reload();
        }

        function ouvrirConnexion() { document.getElementById('zone-connexion').style.display = 'block'; }
        
        function verifierCode() {
            if(document.getElementById('code-secret').value === "1944") {
                document.getElementById('panneau-admin').style.display = 'block';
                document.getElementById('zone-connexion').style.display = 'none';
            } else { alert("Code incorrect !"); }
        }
    </script>
</body>
</html>
