<!-- ====================================================== -->
    <!-- LOGIQUE JAVASCRIPT INTEGRALE (AVEC VRAI COMPTEUR)      -->
    <!-- ====================================================== -->
    <script>
    let compteActuel = null; 
    let bouclePoints = null;
    let monPeer = null;
    let fluxLocal = null;
    
    // Pour le Directeur : Stocke les vraies connexions des auditeurs actifs
    let listeConnexionsAuditeurs = []; 
    
    const ID_FIXE_STUDIO = "transfr-studio-2026-superid"; 

    // --- Fonction unique pour mettre à jour l'affichage ---
    function mettreAJourCompteurVisual(total) {
        document.getElementById('compteur-auditeurs').innerText = total;
    }

    // --- Envoi du vrai nombre à tout le monde (Fonction Directeur) ---
    function diffuserNombreAuditeurs() {
        // Le total = les auditeurs connectés + le directeur lui-même
        let totalReel = listeConnexionsAuditeurs.length + 1;
        
        // 1. Le directeur met à jour son propre compteur
        mettreAJourCompteurVisual(totalReel);
        
        // 2. Le directeur envoie le vrai chiffre à chaque auditeur connecté
        listeConnexionsAuditeurs.forEach(conn => {
            if (conn.open) {
                conn.send({ type: 'CHANGEMENT_COMPTEUR', total: totalReel });
            }
        });
    }

    // --- Boucle Automatique : Attribution des points ---
    function demarrerCompteurPoints() {
        if (bouclePoints) clearInterval(bouclePoints);
        bouclePoints = setInterval(() => {
            if (compteActuel) {
                compteActuel.points = (compteActuel.points || 0) + 1;
                verifierEtCalculerGradeEvolutif();
            }
        }, 60000); // 1 minute = 1 point
    }

    function verifierEtCalculerGradeEvolutif() {
        if (!compteActuel) return;
        
        let points = compteActuel.points || 0;
        let ancienGrade = compteActuel.statut || "Gratuit";
        let nouveauGrade = "Gratuit";

        if (points >= 50) nouveauGrade = "Super Pro An";
        else if (points >= 25) nouveauGrade = "Pro Mois";
        else if (points >= 10) nouveauGrade = "Super Mois";

        compteActuel.statut = nouveauGrade;

        document.getElementById('valeur-points-haut').innerText = points;
        document.getElementById('profil-statut').innerText = formatNomGrade(nouveauGrade);

        if (nouveauGrade !== ancienGrade) {
            alert(`🎉 Bravo ! Tu as atteint ${points} points. Nouvelles fonctions débloquées ! Grade : ${formatNomGrade(nouveauGrade)}`);
        }

        let bddComptes = JSON.parse(localStorage.getItem('transfr-comptes') || '{}');
        bddComptes[compteActuel.pseudo.toLowerCase()].points = points;
        bddComptes[compteActuel.pseudo.toLowerCase()].statut = nouveauGrade;
        localStorage.setItem('transfr-comptes', JSON.stringify(bddComptes));

        activerFonctionsBonusGrade();
    }

    function formatNomGrade(gradeId) {
        if (gradeId === "Super Pro An") return "👑 Super Pro À VIE";
        if (gradeId === "Pro Mois") return "🔥 Pro";
        if (gradeId === "Super Mois") return "⭐ Super Auditeur";
        return "Gratuit";
    }

    function activerFonctionsBonusGrade() {
        if (!compteActuel) return;
        const zoneBonus = document.getElementById('zone-fonctions-bonus');
        const bonusSoundboard = document.getElementById('bonus-soundboard');
        const bonusVote = document.getElementById('bonus-vote');
        const titreBonus = document.getElementById('titre-bonus');
        
        let grade = compteActuel.statut || "Gratuit";
        
        zoneBonus.style.display = 'none';
        bonusSoundboard.style.display = 'none';
        bonusVote.style.display = 'none';
        
        const elPseudo = document.getElementById('profil-pseudo');
        elPseudo.className = "";
        
        if (grade === "Super Mois") {
            elPseudo.classList.add('pseudo-super');
            zoneBonus.style.display = 'block';
            titreBonus.innerText = "⭐ Fonctions débloquées : Super Auditeur";
            titreBonus.style.color = "#00d2ff";
        } 
        else if (grade === "Pro Mois") {
            elPseudo.classList.add('pseudo-pro');
            zoneBonus.style.display = 'block';
            bonusSoundboard.style.display = 'block';
            titreBonus.innerText = "🔥 Fonctions débloquées : Auditeur PRO";
            titreBonus.style.color = "#2ed573";
        } 
        else if (grade === "Super Pro An") {
            elPseudo.classList.add('pseudo-superpro');
            zoneBonus.style.display = 'block';
            bonusSoundboard.style.display = 'block';
            bonusVote.style.display = 'block';
            titreBonus.innerText = "👑 Fonctions débloquées : Super Pro MAX";
            titreBonus.style.color = "#9b59b6";
        }
    }

    function auditeurBruitage(type) { alert(`🎛️ Bruitage "${type}" envoyé au tchat en direct !`); }
    function auditeurVoter() { alert(`🎵 Ta proposition de musique a été reçue par le studio !`); }

    // --- Connexion Directeur (CODE SECRET : 1944) ---
    function ouvrirConnexion() { document.getElementById('zone-connexion').style.display = 'block'; }
    function fermerConnexion() { document.getElementById('zone-connexion').style.display = 'none'; }

    function verifierCode() {
        const code = document.getElementById('code-secret').value;
        if (code === "1944") { 
            alert("🔓 Connexion réussie, bienvenue Directeur de Transfr !");
            document.getElementById('zone-connexion').style.display = 'none';
            document.getElementById('panneau-admin').style.display = 'block';
            initialiserPeerStudio(); 
        } else {
            alert("❌ Code secret incorrect.");
        }
    }

    function donnerPointsDirecteur() {
        let pseudoCible = document.getElementById('admin-offre-pseudo').value.trim();
        if(!pseudoCible) return alert("Indique le pseudo de l'auditeur !");
        
        let bddComptes = JSON.parse(localStorage.getItem('transfr-comptes') || '{}');
        if(!bddComptes[pseudoCible.toLowerCase()]) return alert("Cet auditeur n'existe pas !");
        
        bddComptes[pseudoCible.toLowerCase()].points = (bddComptes[pseudoCible.toLowerCase()].points || 0) + 15;
        localStorage.setItem('transfr-comptes', JSON.stringify(bddComptes));
        alert(`🎁 +15 points offerts à [${pseudoCible}] !`);
        
        if(compteActuel && compteActuel.pseudo.toLowerCase() === pseudoCible.toLowerCase()){
            compteActuel.points += 15;
            verifierEtCalculerGradeEvolutif();
        }
    }

    // --- Inscription / Connexion Auditeur ---
    function creerCompte() {
        const inputPseudo = document.getElementById('inscription-pseudo');
        const pseudo = inputPseudo.value.trim();
        if (!pseudo) return alert("Indique un pseudo !");
        
        let bddComptes = JSON.parse(localStorage.getItem('transfr-comptes') || '{}');
        if (bddComptes[pseudo.toLowerCase()]) return alert("Ce pseudo existe déjà !");
        
        bddComptes[pseudo.toLowerCase()] = { pseudo: pseudo, statut: "Gratuit", points: 0 };
        localStorage.setItem('transfr-comptes', JSON.stringify(bddComptes));
        compteActuel = bddComptes[pseudo.toLowerCase()];
        connexionInterfaceCompte();
    }

    function seConnecterAuditeur() {
        const inputPseudo = document.getElementById('inscription-pseudo');
        const pseudo = inputPseudo.value.trim();
        if (!pseudo) return alert("Indique un pseudo pour te connecter !");
        
        let bddComptes = JSON.parse(localStorage.getItem('transfr-comptes') || '{}');
        if (bddComptes[pseudo.toLowerCase()]) {
            compteActuel = bddComptes[pseudo.toLowerCase()];
            connexionInterfaceCompte();
        } else { alert("Pseudo inconnu. Clique sur S'inscrire !"); }
    }

    function connexionInterfaceCompte() {
        if (!compteActuel) return;
        document.getElementById('bloc-inscription').style.display = 'none';
        document.getElementById('bloc-profil-actif').style.display = 'flex';
        document.getElementById('profil-pseudo').innerText = compteActuel.pseudo;
        document.getElementById('affichage-points-haut').style.display = 'block';
        
        demarrerCompteurPoints();
        verifierEtCalculerGradeEvolutif(); 
        
        const placeholder = document.getElementById('tchat-placeholder');
        if(placeholder) placeholder.remove();

        initialiserPeerAuditeur();
    }

    function deconnexionAuditeur() {
        compteActuel = null;
        if (bouclePoints) clearInterval(bouclePoints);
        document.getElementById('bloc-inscription').style.display = 'block';
        document.getElementById('bloc-profil-actif').style.display = 'none';
        document.getElementById('affichage-points-haut').style.display = 'none';
        document.getElementById('zone-fonctions-bonus').style.display = 'none';
        document.getElementById('btn-ecouter').style.display = 'none';
        document.getElementById('statut-diffusion').innerText = "⚪ En attente du lancement du studio...";
        mettreAJourCompteurVisual(1);
        if(monPeer) monPeer.destroy();
    }

    function envoyerCommentaire() {
        if (!compteActuel) return alert("Tu dois être connecté pour participer au tchat !");
        const msgInput = document.getElementById('chat-message');
        const texte = msgInput.value.trim();
        if (!texte) return;

        const boiteTchat = document.getElementById('boite-tchat-auditeur');
        const p = document.createElement('p');
        p.style.margin = "5px 0";
        p.innerHTML = `<strong style="color: #00d2ff;">${compteActuel.pseudo}</strong> : ${texte}`;
        boiteTchat.appendChild(p);
        boiteTchat.scrollTop = boiteTchat.scrollHeight;
        msgInput.value = "";
    }

    // --- SYSTEME RESEAU PEERJS (VRAI COMPTEUR DE CONNEXIONS EN DIRECT) ---
    function initialiserPeerStudio() {
        if (monPeer) return;
        monPeer = new Peer(ID_FIXE_STUDIO);
        
        monPeer.on('open', (id) => { 
            document.getElementById('mon-id-peer').innerText = id; 
            diffuserNombreAuditeurs(); // Initialise à 1 (Le Directeur)
        });
        
        // Quand un nouvel auditeur ouvre le site de la radio
        monPeer.on('connection', (conn) => {
            listeConnexionsAuditeurs.push(conn);
            
            // Dès qu'il est connecté, on recalcule et on envoie le nouveau total
            conn.on('open', () => {
                diffuserNombreAuditeurs();
            });

            // S'il ferme l'onglet ou se déconnecte
            conn.on('close', () => {
                listeConnexionsAuditeurs = listeConnexionsAuditeurs.filter(c => c.peer !== conn.peer);
                diffuserNombreAuditeurs(); // Met à jour le vrai total immédiatement
            });
        });

        monPeer.on('call', (appel) => { if (fluxLocal) { appel.answer(fluxLocal); } });
    }

    function lancerLiveStudio() {
        if (!monPeer) return alert("Le réseau PeerJS n'est pas prêt.");
        navigator.mediaDevices.getUserMedia({ audio: true, video: false })
        .then((stream) => {
            fluxLocal = stream;
            document.getElementById('btn-lancer-live').style.background = "#ea2027";
            document.getElementById('btn-lancer-live').innerText = "📡 EN DIRECT (MICRO ALLUMÉ)";
            alert("🟢 Ton micro de studio est ouvert !");
        });
    }

    function initialiserPeerAuditeur() {
        if (monPeer) monPeer.destroy();
        monPeer = new Peer();
        
        monPeer.on('open', (id) => {
            const studioConn = monPeer.connect(ID_FIXE_STUDIO);
            
            studioConn.on('open', () => {
                document.getElementById('statut-diffusion').innerHTML = "🟢 Le Studio Transfr est en ligne !";
                document.getElementById('statut-diffusion').style.color = "#2ed573";
                document.getElementById('btn-ecouter').style.display = "block";
            });

            // L'auditeur reçoit les messages envoyés par le Studio
            studioConn.on('data', (donnees) => {
                if (donnees && donnees.type === 'CHANGEMENT_COMPTEUR') {
                    // On affiche le VRAI nombre envoyé par la console du studio
                    mettreAJourCompteurVisual(donnees.total);
                }
            });
        });
    }

    function demarrerEcouteDirect() {
        if (!monPeer) return;
        const audioVide = createEmptyAudioStream();
        const appel = monPeer.call(ID_FIXE_STUDIO, audioVide);
        appel.on('stream', (fluxStudio) => {
            const baliseAudio = document.getElementById('audio-live');
            baliseAudio.srcObject = fluxStudio;
            baliseAudio.play();
            document.getElementById('btn-ecouter').style.background = "#ff4757";
            document.getElementById('btn-ecouter').innerText = "🛑 Couper le son";
            document.getElementById('btn-ecouter').onclick = couperSonDirect;
        });
    }

    function couperSonDirect() {
        document.getElementById('audio-live').srcObject = null;
        document.getElementById('btn-ecouter').style.background = "#2ed573";
        document.getElementById('btn-ecouter').innerText = "▶️ Écouter le Direct";
        document.getElementById('btn-ecouter').onclick = demarrerEcouteDirect;
    }

    function createEmptyAudioStream() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = ctx.createOscillator();
        const dst = ctx.createMediaStreamDestination();
        oscillator.connect(dst); oscillator.start();
        const track = dst.stream.getAudioTracks()[0]; track.enabled = false;
        return new MediaStream([track]);
    }
    function ajouterLienMusique() { alert("Option de lien activée."); }
    </script>
