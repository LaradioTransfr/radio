<!-- ====================================================== -->
<!-- SECTION 1 : CRÉATION DE COMPTE & PROFIL AUDITEUR AVEC AVATAR & PAIEMENT -->
<!-- ====================================================== -->
<div id="zone-compte-utilisateur" style="max-width: 1100px; margin: 0 auto 20px auto; background: #14141f; padding: 20px; border-radius: 12px; border: 1px solid #2d2d44;">
    
    <!-- ÉCRAN 1 : FORMULAIRE D'INSCRIPTION -->
    <div id="bloc-inscription">
        <h3 style="color: #00d2ff; margin-top: 0;">👤 CRÉER UN COMPTE TRANSFR (Gratuit la 1ère année !)</h3>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <input type="text" id="inscription-pseudo" placeholder="Choisis ton pseudo..." style="flex: 1; min-width: 200px; padding: 10px; border-radius: 6px; border: 1px solid #3d3d5c; background: #12121a; color: white; font-size: 14px;">
            <button onclick="creerCompte()" style="background: #2ed573; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer;">S'inscrire</button>
        </div>
    </div>
    
    <!-- ÉCRAN 2 : PROFIL ACTIF (AVEC PHOTO ET PAIEMENT) -->
    <div id="bloc-profil-actif" style="display: none; flex-direction: column; gap: 15px;">
        <div style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap;">
            
            <!-- BLOC PHOTO DE PROFIL -->
            <div style="position: relative; text-align: center;">
                <img id="profil-photo-img" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=150" alt="Avatar" style="width: 70px; height: 70px; border-radius: 50%; border: 2px solid #00d2ff; object-fit: cover;">
                <label for="input-changer-avatar" style="display: block; font-size: 10px; color: #00d2ff; cursor: pointer; text-decoration: underline; margin-top: 5px;">Changer la photo</label>
                <input type="file" id="input-changer-avatar" accept="image/*" onchange="changerMaPhoto(this)" style="display: none;">
            </div>

            <!-- INFOS DU COMPTE -->
            <div style="flex: 1;">
                <div style="margin-bottom: 5px;">
                    <span style="font-size: 14px; color: #aaa;">Mon Compte :</span>
                    <strong id="profil-pseudo" style="font-size: 20px; color: #00d2ff; margin-left: 5px;">Pseudo</strong>
                </div>
                <div>
                    <span style="font-size: 14px; color: #aaa;">Statut Actuel :</span>
                    <span id="profil-statut" style="background: #2ed573; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-left: 5px;">Gratuit (1 an)</span>
                </div>
            </div>

            <!-- BOUTON DE PAIEMENT SÉCURISÉ INTÉGRÉ -->
            <div id="bloc-paiement-profil" style="background: rgba(255, 165, 0, 0.1); border: 1px solid #ffa502; padding: 12px 20px; border-radius: 8px; text-align: center;">
                <div style="font-size: 11px; color: #ffa502; font-weight: bold; margin-bottom: 6px; letter-spacing: 0.5px;">💳 ESPACE ABONNEMENT</div>
                <button onclick="ouvrirAchatSecurise()" style="background: #ffa502; color: #1e1e2f; border: none; padding: 8px 16px; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: transform 0.2s;">
                    Changer d'offre / Payer
                </button>
            </div>

        </div>
    </div>
</div>

<script>
// ======================================================
// AJOUTS JAVASCRIPT POUR LA PHOTO ET LE PAIEMENT
// ======================================================

function creerCompte() {
    const inputPseudo = document.getElementById('inscription-pseudo');
    const pseudo = inputPseudo.value.trim();
    if (!pseudo) return alert("Indique un pseudo !");
    
    let bddComptes = JSON.parse(localStorage.getItem('transfr-comptes') || '{}');
    if (!bddComptes[pseudo.toLowerCase()]) {
        bddComptes[pseudo.toLowerCase()] = { 
            pseudo: pseudo, 
            statut: "Gratuit (1 an)",
            avatar: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=150" 
        };
        localStorage.setItem('transfr-comptes', JSON.stringify(bddComptes));
    }
    compteActuel = bddComptes[pseudo.toLowerCase()];
    connexionInterfaceCompte();
}

function connexionInterfaceCompte() {
    if (!compteActuel) return;
    document.getElementById('bloc-inscription').style.display = 'none';
    document.getElementById('bloc-profil-actif').style.display = 'flex'; // Devient flex pour s'afficher correctement
    document.getElementById('profil-pseudo').innerText = compteActuel.pseudo;
    document.getElementById('profil-statut').innerText = compteActuel.statut;
    
    // Charger la photo si elle existe
    if (compteActuel.avatar) {
        document.getElementById('profil-photo-img').src = compteActuel.avatar;
    }
    
    document.getElementById('boite-tchat-auditeur').innerHTML = `<p style="color: #2ed573; font-style: italic; margin: 0;">Connecté en tant que ${compteActuel.pseudo}. Bienvenue !</p>`;
}

// Fonction pour changer la photo de profil
function changerMaPhoto(input) {
    if (input.files && input.files[0] && compteActuel) {
        const reader = new FileReader();
        reader.onload = function(e) {
            // Mettre à jour l'image à l'écran
            document.getElementById('profil-photo-img').src = e.target.result;
            
            // Sauvegarder dans la base de données locale
            let bddComptes = JSON.parse(localStorage.getItem('transfr-comptes') || '{}');
            bddComptes[compteActuel.pseudo.toLowerCase()].avatar = e.target.result;
            localStorage.setItem('transfr-comptes', JSON.stringify(bddComptes));
            
            compteActuel.avatar = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
    }
}

// Fenêtre de simulation de paiement
function ouvrirAchatSecurise() {
    if (!compteActuel) return;
    let choix = prompt(
        "💳 PASSERELLE DE PAIEMENT TRANSFR\n\n" +
        "Choisis ton mode en tapant le numéro (1, 2 ou 3) :\n" +
        "1) Mode Normal (1€ / mois ou 3€ / an)\n" +
        "2) Mode Super (2€ / mois ou 4€ / an)\n" +
        "3) Format PRO (3€ / mois ou 5€ / an)\n\n" +
        "Note : Le grade 'Super Pro à Vie' s'obtient uniquement via le Directeur."
    );

    let bddComptes = JSON.parse(localStorage.getItem('transfr-comptes') || '{}');
    
    if (choix === "1") {
        bddComptes[compteActuel.pseudo.toLowerCase()].statut = "Mode Normal";
        alert("💰 Paiement validé ! Vous êtes maintenant en Mode Normal.");
    } else if (choix === "2") {
        bddComptes[compteActuel.pseudo.toLowerCase()].statut = "Mode Super";
        alert("💰 Paiement validé ! Vous êtes maintenant en Mode Super.");
    } else if (choix === "3") {
        bddComptes[compteActuel.pseudo.toLowerCase()].statut = "Format PRO";
        alert("💰 Paiement validé ! Vous êtes maintenant en Format PRO.");
    } else if (choix !== null) {
        alert("❌ Option invalide.");
        return;
    } else {
        return; // Annulé
    }

    localStorage.setItem('transfr-comptes', JSON.stringify(bddComptes));
    compteActuel.statut = bddComptes[compteActuel.pseudo.toLowerCase()].statut;
    document.getElementById('profil-statut').innerText = compteActuel.statut;
}
</script>
