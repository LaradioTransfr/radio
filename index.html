<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Transfr - Correction Forcee</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background-color: #0c0c14; color: white; font-family: sans-serif; }
        /* Fenêtre de connexion forcée au premier plan */
        #zone-connexion { 
            display: none; 
            position: fixed; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            background: #1e1e2f; 
            padding: 30px; 
            border: 3px solid #00d2ff; 
            z-index: 10000; 
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        .btn-admin-test {
            background: #4a4a6a;
            color: white;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 12px;
            border-radius: 5px;
            border: 1px solid #666;
        }
    </style>
</head>
<body>

    <div style="padding: 10px; background: #14141f; border-bottom: 1px solid #333; display: flex; justify-content: space-between;">
        <span>Radio Transfr v6.1</span>
        <button class="btn-admin-test" onclick="ouvrirConnexion()">[ ZONE ADMIN ]</button>
    </div>

    <div style="text-align: center; padding: 50px;">
        <h1>📻 Bienvenue sur Transfr</h1>
        <p>Clique sur le bouton gris en haut à droite pour te connecter.</p>
        
        <p><a href="confidentialite.html" style="color: #00d2ff;">🔒 Politique de Confidentialité</a></p>
    </div>

    <div id="zone-connexion">
        <h2 style="margin-top:0;">🔑 Connexion Admin</h2>
        <input type="password" id="code-secret" placeholder="Code secret..." style="padding: 10px; width: 200px;">
        <br><br>
        <button onclick="verifierCode()" style="padding: 10px; background: #2ed573; border: none; cursor: pointer; font-weight: bold;">VALIDER</button>
        <button onclick="fermerConnexion()" style="padding: 10px; background: #ff4757; border: none; cursor: pointer; color: white;">FERMER</button>
    </div>

    <div id="panneau-admin" style="display:none; padding: 20px; background: #14141f; border: 2px dashed #9b59b6; margin: 20px;">
        <h3>🛠️ Console d'Administration Active</h3>
        <p>Bravo Macéo, tu es connecté !</p>
        </div>

    <script>
        // FONCTIONS SIMPLIFIÉES AU MAXIMUM
        function ouvrirConnexion() {
            console.log("Tentative d'ouverture...");
            document.getElementById('zone-connexion').style.display = 'block';
        }

        function fermerConnexion() {
            document.getElementById('zone-connexion').style.display = 'none';
        }

        function verifierCode() {
            const code = document.getElementById('code-secret').value;
            if (code === '1944') {
                document.getElementById('panneau-admin').style.display = 'block';
                document.getElementById('zone-connexion').style.display = 'none';
                alert("Accès réussi !");
            } else {
                alert("Mauvais code !");
            }
        }
    </script>
</body>
</html>
