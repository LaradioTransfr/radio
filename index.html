<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Transfr</title>
    <style>
        body {
            background-color: #111625;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .main-container {
            background-color: #1a2035;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.3);
            position: relative;
        }

        .admin-top-right {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 999;
            background-color: #252d4a;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            color: #a0aec0;
            border: 1px solid #2d3748;
            outline: none;
        }

        .admin-top-right:active, .admin-top-right:hover {
            background-color: #00bcd4;
            color: #111625;
        }

        .admin-panel {
            display: none;
            background-color: #252d4a;
            border: 2px solid #00bcd4;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            margin-top: 45px;
        }

        .admin-box {
            background-color: #111625;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #3d4b75;
        }

        .admin-box h4 {
            margin: 0 0 8px 0;
            color: #00bcd4;
            font-size: 14px;
        }

        .admin-select, .admin-input {
            width: 100%;
            background-color: #0b0e19;
            color: white;
            border: 1px solid #252d4a;
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 10px;
            font-size: 13px;
            box-sizing: border-box;
            outline: none;
        }

        .admin-input::placeholder {
            color: #4a5568;
        }

        .header-section {
            text-align: center;
            margin-bottom: 15px;
            margin-top: 35px;
        }

        .header-title {
            color: #00bcd4;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 1px;
            margin: 5px 0;
        }

        .status-badge {
            background-color: #2c241c;
            color: #ff9800;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            display: inline-block;
            margin: 10px 0;
        }

        .live-section {
            background-color: #111625;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #252d4a;
        }

        .live-title {
            color: #ff4444;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .live-player {
            width: 100%;
        }

        .chat-section {
            background-color: #111625;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #252d4a;
        }

        .section-title {
            color: #00bcd4;
            font-weight: bold;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .chat-box {
            background-color: #0b0e19;
            border: 1px solid #252d4a;
            border-radius: 8px;
            height: 120px;
            padding: 10px;
            color: #707a9e;
            font-style: italic;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .input-box {
            width: 100%;
            background-color: #0b0e19;
            border: 1px solid #252d4a;
            border-radius: 8px;
            padding: 10px;
            color: #ffffff;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        .cyan-button {
            background-color: #00bcd4;
            color: #111625;
            border: none;
            border-radius: 8px;
            width: 100%;
            padding: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 5px;
        }

        .podcasts-section {
            background-color: #111625;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #252d4a;
        }

        .podcasts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }

        .podcast-item {
            text-align: center;
            cursor: pointer;
        }

        .podcast-icon {
            background-color: #252d4a;
            width: 60px;
            height: 60px;
            border-radius: 12px;
            margin: 0 auto 6px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .podcast-name {
            font-size: 11px;
            color: #a0aec0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 4px;
        }

        .privacy-link {
            text-align: center;
            font-size: 12px;
            margin-top: 15px;
        }

        .privacy-link a {
            color: #707a9e;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <button class="admin-top-right" id="btnAdmin">🔑 Admin</button>

        <div class="header-section">
            <h1 class="header-title">📻 RADIO TRANSFR</h1>
            <div id="statusBadge" class="status-badge">⚪ Studio Hors Ligne</div>
        </div>

        <div id="zoneAdmin" class="admin-panel">
            <h3 style="color: #00bcd4; margin-top: 0; text-align: center;">🛠️ TABLEAU DE BORD TRANSFR</h3>
            
            <div class="admin-box">
                <h4>🔴 CONTRÔLE DU DIRECT</h4>
                <button class="cyan-button" style="background-color: #ff4444; color: white;" onclick="lancerDirect()">🚀 LANCER LE DIRECT SUR TOUS LES APPAREILS</button>
                <button class="cyan-button" style="background-color: #333; color: #aaa;" onclick="couperDirect()">🛑 Couper le direct</button>
            </div>

            <div class="admin-box">
                <h4>🎵 SCANNER DE MUSIQUE LIBRE DE DROIT</h4>
                <input type="file" id="musicScanner" style="font-size: 11px; margin-bottom: 5px;">
                <button class="cyan-button" style="background-color: #4cd137; color: white; padding: 6px;" onclick="analyserMusique()">🔍 Analyser la musique</button>
                <div id="scanResult" style="font-size: 12px; font-weight: bold; margin-top: 5px; text-align: center;"></div>
            </div>

            <div class="admin-box">
                <h4>🎙️ ENREGISTREUR DE PODCAST</h4>
                
                <label style="font-size: 12px; color: #a0aec0; display: block; margin-bottom: 5px;">Titre du podcast :</label>
                <input type="text" id="podcastTitleInput" class="admin-input" placeholder="Ex: Émission Rap, Spécial Espace...">

                <label style="font-size: 12px; color: #a0aec0; display: block; margin-bottom: 5px;">Visibilité :</label>
                <select id="podcastVisibility" class="admin-select" onchange="togglePinInput()">
                    <option value="public">🌍 Public (Visible par tous)</option>
                    <option value="private">🔒 Privé (Code PIN personnalisé)</option>
                </select>

                <div id="pinBox" style="display: none;">
                    <label style="font-size: 12px; color: #ff9800; display: block; margin-bottom: 5px;">Définir le code PIN de ce podcast :</label>
                    <input type="text" id="podcastPinInput" class="admin-input" placeholder="Ex: 1234, 0000..." maxlength="8" style="border: 1px solid #ff9800;">
                </div>

                <button class="cyan-button" style="background-color: #00bcd4;" id="btnRecord" onclick="actionPodcast()">🎤 Commencer l'enregistrement micro</button>
                <p id="podcastStatus" style="font-size: 11px; color: #a0aec0; text-align: center; margin: 5px 0 0 0;"></p>
