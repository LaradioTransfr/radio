<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Transfr - Studio Expert Pro</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        .zone-cliquable-profil { cursor: pointer; transition: background 0.2s; padding: 10px; border-radius: 8px; user-select: none; }
        .zone-cliquable-profil:hover { background: rgba(0, 210, 255, 0.08); }
        .pseudo-super { color: #00d2ff; font-weight: bold; }
        .pseudo-pro { color: #2ed573; font-weight: bold; text-shadow: 0 0 8px #2ed573; }
        .pseudo-superpro { color: #9b59b6; font-weight: bold; text-shadow: 0 0 10px #9b59b6; animation: brille 1.5s infinite alternate; }
        @keyframes brille { from { text-shadow: 0 0 5px #9b59b6; } to { text-shadow: 0 0 15px #d988ff; } }
    </style>
</head>
<body style="background-color: #0c0c14; margin: 0; padding: 20px; font-family: 'Segoe UI', Tahoma, Verdana, sans-serif; color: white; min-height: 90vh;">

    <div style="max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px;">
        <div id="affichage-points-haut" style="font-weight: bold; font-size: 14px; background: rgba(0, 210, 255, 0.1); padding: 6px 12px; border-radius: 20px; border: 1px solid #00d2ff; color: #00d2ff; display: none;">
            🪙 Mes Points : <span id="valeur-points-haut">0</span> pt(s)
        </div>
        <span onclick="ouvrirConnexion()" style="color: #4a4a6a; cursor: pointer; text-decoration: underline; font-size: 12px;">[ Zone Admin ]</span>
    </div>

    <div id="zone-compte-utilisateur" style="max-width: 1100px; margin: 0 auto 20px auto; background: #14141f; padding: 20px; border-radius: 12px; border: 1px solid #2d2d44;">
        <div id="bloc-inscription">
            <h3 style="color: #00d2ff; margin-top: 0;">👤 COMPTE AUDITEUR TRANSFR</h3>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="inscription-pseudo" placeholder="Pseudo..." style="flex: 1; padding: 10px; border-radius: 6px; background: #12121a; color: white; border: 1px solid #3d3d5c;">
                <button onclick="creerCompte()">S'inscrire</button>
                <button onclick="seConnecterAuditeur()">Se connecter</button>
            </div>
        </div>
        <div id="bloc-profil-actif" style="display: none;">
            <strong>Profil : <span id="profil-pseudo"></span></strong> | Statut : <span id="profil-statut">Gratuit</span>
        </div>
    </div>
    <div id="zone-compte-rebours" style="max-width: 500px; margin: 0 auto 20px auto; background: #14141f; padding: 15px; border-radius: 12px; border: 1px solid #9b59b6; text-align: center;">
        <h4 style="color: #9b59b6; margin: 0;">🚀 PROCHAIN LIVE DANS :</h4>
        <div id="affichage-timer" style="font-weight: bold; color: #ff4757; font-size: 20px;">Chargement...</div>
    </div>

    <div id="zone-fonctions-bonus" style="max-width: 500px; margin: 0 auto 20px auto; display: none; background: #1a1a2e; border: 1px solid #2ed573; padding: 15px; border-radius: 12px; text-align: center;">
        <h4 style="color: #2ed573;">⚡ Tes Avantages Débloqués</h4>
        <button onclick="auditeurBruitage('klaxon')">📯 Klaxon</button>
        <button onclick="auditeurBruitage('laser')">🔫 Laser</button>
        <div id="bonus-vote" style="display: none; margin-top: 10px;"><button onclick="auditeurVoter()">🎵 Voter</button></div>
    </div>

    <div id="panneau-admin" style="display: none; max-width: 1100px; margin: 20px auto; background: #14141f; padding: 20px; border: 2px solid #9b59b6;">
        <h3 style="color: #9b59b6;">🛠️ CONSOLE DIRECTEUR</h3>
        <input type="text" id="admin-offre-pseudo" placeholder="Pseudo...">
        <button onclick="donnerPointsDirecteur()">🎁 Offrir +50 Points</button>
        <br><br>
        <button id="btn-lancer-live" style="background: #2ed573; color: white; border: none; padding: 20px; width: 100%; font-size: 18px; cursor: pointer;">🔴 ALLUMER LE MICRO / LANCER LE DIRECT</button>
    </div>

    <div id="zone-connexion" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1e1e2f; padding: 20px; border: 2px solid #00d2ff; z-index: 999;">
        <input type="password" id="code-secret" placeholder="Code secret...">
        <button onclick="verifierCode()">Valider</button>
    </div>
    <script>
        let compteActuel = null;
        // Date cible : 25 Mai 2026 à 18h00
        const dateDebut = new Date(2026, 4, 25, 18, 0, 0);

        // 1. Bouton Live réparé
        document.getElementById('btn-lancer-live').addEventListener('click', function() {
            if (this.innerText.includes("ALLUMER")) {
                this.style.backgroundColor = "#ff4757";
                this.innerText = "⏹️ ARRÊTER LE DIRECT";
            } else {
                this.style.backgroundColor = "#2ed573";
                this.innerText = "🔴 ALLUMER LE MICRO / LANCER LE DIRECT";
            }
        });

        // 2. Compte à rebours automatique
        function updateTimer() {
            const diff = dateDebut - new Date();
            if (diff <= 0) { document.getElementById('affichage-timer').innerText = "🔴 LE LIVE A COMMENCÉ !"; return; }
            const j = Math.floor(diff / (1000*60*60*24));
            const h = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
            const m = Math.floor((diff % (1000*60*60)) / (1000*60));
            document.getElementById('affichage-timer').innerText = j + "j " + h + "h " + m + "m";
        }
        setInterval(updateTimer, 1000);
        updateTimer();

        // 3. Logique Points et Déblocage
        function verifierDeblocage() {
            if (!compteActuel) return;
            const pts = compteActuel.points || 0;
            if (pts >= 50) document.getElementById('zone-fonctions-bonus').style.display = 'block';
            if (pts >= 100) document.getElementById('bonus-vote').style.display = 'block';
        }

        function donnerPointsDirecteur() {
            let pseudo = document.getElementById('admin-offre-pseudo').value.trim().toLowerCase();
            let bdd = JSON.parse(localStorage.getItem('transfr-comptes') || '{}');
            if(bdd[pseudo]) {
                bdd[pseudo].points = (bdd[pseudo].points || 0) + 50;
                localStorage.setItem('transfr-comptes', JSON.stringify(bdd));
                if(compteActuel && compteActuel.pseudo.toLowerCase() === pseudo) {
                    compteActuel.points = bdd[pseudo].points;
                    document.getElementById('valeur-points-haut').innerText = compteActuel.points;
                    verifierDeblocage();
                }
                alert("50 points ajoutés !");
            }
        }

        function verifierCode() {
            if(document.getElementById('code-secret').value === "1944") {
                document.getElementById('panneau-admin').style.display = 'block';
                document.getElementById('zone-connexion').style.display = 'none';
            } else { alert("Code incorrect !"); }
        }

        function seConnecterAuditeur() {
            let p = document.getElementById('inscription-pseudo').value.toLowerCase();
            let bdd = JSON.parse(localStorage.getItem('transfr-comptes') || '{}');
            if(bdd[p]) {
                compteActuel = bdd[p];
                document.getElementById('bloc-profil-actif').style.display = 'block';
                document.getElementById('affichage-points-haut').style.display = 'block';
                document.getElementById('valeur-points-haut').innerText = compteActuel.points;
                document.getElementById('profil-pseudo').innerText = compteActuel.pseudo;
                verifierDeblocage();
            }
        }

        function creerCompte() {
            let p = document.getElementById('inscription-pseudo').value;
            if(!p) return;
            compteActuel = { pseudo: p, points: 10 };
            localStorage.setItem('transfr-comptes', JSON.stringify({ [p.toLowerCase()]: compteActuel }));
            alert("Compte créé !");
        }

        function ouvrirConnexion() { document.getElementById('zone-connexion').style.display = 'block'; }
        function auditeurBruitage(t) { alert("Effet " + t + " lancé !"); }
        function auditeurVoter() { alert("Vote enregistré !"); }
    </script>
</body>
</html>
