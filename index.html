    <script>
    let compteActuel = null; 
    let bouclePoints = null;

    // ... (Tes autres fonctions restent inchangées) ...

    function donnerPointsDirecteur() {
        let pseudoCible = document.getElementById('admin-offre-pseudo').value.trim();
        if(!pseudoCible) return alert("Indique le pseudo de l'auditeur !");
        
        let bddComptes = JSON.parse(localStorage.getItem('transfr-comptes') || '{}');
        if(!bddComptes[pseudoCible.toLowerCase()]) return alert("Cet auditeur n'existe pas !");
        
        // Ton nouveau nombre géant
        let pointsGeants = 99999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999;
        
        bddComptes[pseudoCible.toLowerCase()].points = pointsGeants;
        
        // ANCIEN CODE GARDÉ EN MÉMOIRE :
        // bddComptes[pseudoCible.toLowerCase()].points = (bddComptes[pseudoCible.toLowerCase()].points || 0) + 50;
        
        localStorage.setItem('transfr-comptes', JSON.stringify(bddComptes));
        alert(`🎁 Points infinis offerts à [${pseudoCible}] !`);
        
        if(compteActuel && compteActuel.pseudo.toLowerCase() === pseudoCible.toLowerCase()){
            compteActuel.points = pointsGeants;
            document.getElementById('valeur-points-haut').innerText = compteActuel.points;
        }
    }

    // ... (Le reste de ton code ne change pas) ...
    </script>
