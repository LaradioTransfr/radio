<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Transfr - Studio Pro</title>
    <style>
        /* DESIGN GLOBAL DE LA RADIO */
        body {
            background-color: #111625;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 120px; /* Espace pour pas que la boîte d'enregistrement cache le bas */
        }

        .container {
            background-color: #1a2035;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        .header-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .header-title {
            color: #00bcd4;
            font-size: 26px;
            margin: 10px 0;
        }

        .status-badge {
            background-color: #ff4444;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            font-weight: bold;
        }

        /* BOUTONS NAVIGATION MULTIMÉDIA */
        .nav-buttons-container {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            justify-content: center;
            width: 100%;
        }

        .cyan-button {
            background-color: #00bcd4;
            color: #111625;
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            flex: 1;
            text-align: center;
            transition: background 0.2s;
        }

        .cyan-button:hover {
            background-color: #0097a7;
        }

        .red-button {
            background-color: #ff4444;
            color: white;
        }

        .red-button:hover {
            background-color: #cc3333;
        }

        /* LECTEUR ET STUDIO AUDIO */
        .studio-box {
            background-color: #111625;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #252d4a;
            margin-bottom: 20px;
            text-align: center;
        }

        .btn-record {
            background-color: #ff4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 68, 68, 0.4);
            outline: none;
        }

        .btn-record.recording {
            animation: pulse 1s infinite;
            background-color: #aa0000;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* CORRECTION MAJEURE : LA BOÎTE D'ENREGISTREMENT FLOTTANTE */
        .recording-section {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 420px;
            background-color: #1a2035;
            border: 2px solid #00bcd4;
            border-radius: 12px;
            padding: 15px;
            z-index: 99999; /* Reste au-dessus de absolument tout */
            box-shadow: 0px -4px 25px rgba(0, 0, 0, 0.6);
            box-sizing: border-box;
            display: none; /* Cachée par défaut, s'affiche en JS */
            text-align: center;
        }

        /* LE TCHAT EN DIRECT */
        .chat-box {
            background-color: #111625;
            border: 1px solid #252d4a;
            border-radius: 12px;
            padding: 10px;
        }

        .chat-messages {
            height: 150px;
            overflow-y: auto;
            border-bottom: 1px solid #252d4a;
            padding-bottom: 10px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg {
            font-size: 14px;
            background-color: #252d4a;
            padding: 8px 12px;
            border-radius: 8px;
            width: fit-content;
            max-width: 85%;
        }

        .msg-user {
            color: #00bcd4;
            font-weight: bold;
        }

        .chat-input-area {
            display: flex;
            gap: 8px;
        }

        .chat-input {
            flex: 1;
            background-color: #0b0e19;
            border: 1px solid #252d4a;
            border-radius: 6px;
            padding: 8px;
            color: white;
            outline: none;
        }

        .chat-input:focus {
            border-color: #00bcd4;
        }

        audio {
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header-section">
            <h1 class="header-title">📻 RADIO TRANSFR</h1>
            <div id="statusBadge" class="status-badge">🔴 En Direct Studio</div>
        </div>

        <div class="nav-buttons-container">
            <button class="cyan-button" onclick="window.location.href='reseau.html'">🌐 Transfr Réseau</button>
            <button class="cyan-button red-button" onclick="window.location.href='shorts.html'">🎬 Transfr Shorts</button>
        </div>

        <div class="studio-box">
            <h3 style="margin-top:0; color:#a0aec0; font-size:14px;">STUDIO D'ENREGISTREMENT</h3>
            <p id="recordStatus" style="font-size:13px; color:#707a9e;">Prêt à enregistrer ton émission ?</p>
            <button id="recordBtn" class="btn-record" onclick="toggleEnregistrement()">🎤</button>
        </div>

        <div class="chat-box">
            <h4 style="margin: 0 0 10px 0; font-size: 14px; color:#00bcd4;">💬 Tchat en direct</h4>
            <div id="chatMessages" class="chat-messages">
                <div class="msg"><span class="msg-user">@Système:</span> Bienvenue sur le tchat de la radio TRANSFR ! 🎉</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatMsgInput" class="chat-input" placeholder="Écris un message...">
                <button class="cyan-button" style="flex:none; padding:0 15px;" onclick="envoyerMessage()">Envoyer</button>
            </div>
        </div>

    </div>

    <div id="recordingSection" class="recording-section">
        <span style="color: #00bcd4; font-weight: bold; display: block; margin-bottom: 5px; font-size: 14px;">🎧 Émission Enregistrée !</span>
        <audio id="audioPlayback" controls></audio>
        <div style="margin-top: 10px; display: flex; gap: 8px;">
            <button class="cyan-button" style="font-size: 12px; padding: 6px;" onclick="fermerFenetreAudio()">Fermer</button>
        </div>
    </div>

    <script>
        // --- LOGIQUE ENREGISTREUR AUDIO ---
        let mediaRecorder;
        let audioChunks = [];
        let estEnTrainDEnregistrer = false;

        function toggleEnregistrement() {
            const btn = document.getElementById("recordBtn");
            const statusText = document.getElementById("recordStatus");
            const bottomSection = document.getElementById("recordingSection");

            if (!estEnTrainDEnregistrer) {
                // Lancer l'enregistrement
                navigator.mediaDevices.getUserMedia({ audio: true })
                    .then(stream => {
                        mediaRecorder = new MediaRecorder(stream);
                        audioChunks = [];

                        mediaRecorder.ondataavailable = event => {
                            audioChunks.push(event.data);
                        };

                        mediaRecorder.onstop = () => {
                            const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                            const audioUrl = URL.createObjectURL(audioBlob);
                            document.getElementById("audioPlayback").src = audioUrl;
                            
                            // Faire apparaître la boîte flottante tout en bas
                            bottomSection.style.display = "block";
                        };

                        mediaRecorder.start();
                        estEnTrainDEnregistrer = true;
                        btn.classList.add("recording");
                        btn.innerText = "🛑";
                        statusText.innerText = "🔴 Enregistrement en cours de ton émission...";
                    })
                    .catch(err => {
                        alert("Erreur micro : Autorise le micro pour enregistrer ta radio ! 🎙️");
                        console.error(err);
                    });
            } else {
                // Arrêter l'enregistrement
                mediaRecorder.stop();
                estEnTrainDEnregistrer = false;
                btn.classList.remove("recording");
                btn.innerText = "🎤";
                statusText.innerText = "Émission enregistrée avec succès ! Regarde en bas de ton écran.";
            }
        }

        function fermerFenetreAudio() {
            document.getElementById("recordingSection").style.display = "none";
            document.getElementById("recordStatus").innerText = "Prêt à enregistrer ton émission ?";
        }

        // --- LOGIQUE DU TCHAT ---
        function envoyerMessage() {
            const input = document.getElementById("chatMsgInput");
            const messageText = input.value.trim();
            if (messageText === "") return;

            const chatMessages = document.getElementById("chatMessages");
            
            // Création du message de l'utilisateur
            const nouveauMessage = document.createElement("div");
            nouveauMessage.className = "msg";
            nouveauMessage.innerHTML = `<span class="msg-user">@Auditeur:</span> ${messageText}`;
            
            chatMessages.appendChild(nouveauMessage);
            input.value = "";
            
            // Scroll automatique vers le bas
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Permettre d'envoyer le message avec la touche "Entrée"
        document.getElementById("chatMsgInput").addEventListener("keyup", function(event) {
            if (event.key === "Enter") {
                envoyerMessage();
            }
        });
    </script>
</body>
</html>
