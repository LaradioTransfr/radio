<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Transfr - Studio Expert Pro</title>
    <style>
        body { background-color: #0c0c14; margin: 0; padding: 20px; font-family: 'Segoe UI', sans-serif; color: white; }
        .box { background: #14141f; padding: 20px; border-radius: 12px; border: 1px solid #2d2d44; }
        .live-banner { background: linear-gradient(90deg, #00d2ff, #9b59b6); padding: 15px; border-radius: 12px; text-align: center; font-weight: bold; margin: 0 auto 20px auto; max-width: 1100px; color: white; font-size: 18px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .btn-admin { background: #9b59b6; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Bandeau Heure du Live -->
    <div id="zone-prochain-live" class="live-banner">
        🕒 Prochain Live Transfr : <span id="affichage-heure-live">Chargement...</span>
    </div>

    <!-- Zone Admin -->
    <div style="max-width: 1100px; margin: 0 auto; text-align: right; margin-bottom: 10px;">
        <span onclick="ouvrirConnexion()" style="color: #4a4a6a; cursor: pointer; font-size: 12px; text-decoration: underline;">[ Zone Admin ]</span>
    </div>

    <!-- Panneau Admin (caché par défaut) -->
    <div id="panneau-admin" class="box" style="display: none; max-width: 1100px; margin: 0 auto 20px auto; border: 2px solid #9b59b6;">
        <h3 style="color: #9b59b6; margin-top: 0;">🛠️ CONSOLE DIRECTEUR</h3>
        <input type="text" id="input-heure-live" placeholder="Ex: Mercredi à 14h" style="padding: 10px; width: 250px;">
        <button onclick="mettreAJourHeure()" class="btn-admin">Modifier l'heure du Live</button>
        <hr style="border: 0; border-top: 1px solid #3d3d5c; margin: 15px 0;">
        <input type="text" id="admin-offre-pseudo" placeholder="Pseudo auditeur..." style="padding: 10px;">
        <button onclick="donnerPointsDirecteur()" style="background: #ffa502; border: none; padding: 10px; cursor: pointer; font-weight: bold;">🎁 Offrir +50 Points</button>
    </div>

    <!-- Zone de connexion -->
    <div id="zone-connexion" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1e1e2f; padding: 20px; border: 1px solid #00d2ff; border-radius: 10px; z-index: 1000;">
        <input type="password" id="code-secret" placeholder="Code secret...">
        <button onclick="verifierCode()">Valider</button>
    </div>

    <!-- Lecteur Radio (Interface principale) -->
    <div id="lecteur-auditeur" class="box" style="text-align: center; max-width: 500px; margin: 0 auto;">
        <h1 style="color: #00d2ff; margin-top: 0;">📻 RADIO TRANSFR</h1>
        <p>Bienvenue sur ton studio !</p>
        <div id="statut-diffusion" style="color: #aaa; margin: 20px 0;">⚪ En attente du direct...</div>
    </div>

    <script>
        // --- GESTION HEURE LIVE ---
        function mettreAJourHeure() {
            const heure = document.getElementById('input-heure-live').value;
            localStorage.setItem('transfr-prochain-live', heure);
            document.getElementById('affichage-heure-live').innerText = heure;
            alert("Heure mise à jour !");
        }

        // --- GESTION POINTS ---
        function donnerPointsDirecteur() {
            let pseudoCible = document.getElementById('admin-offre-pseudo').value.trim();
            let bdd = JSON.parse(localStorage.getItem('transfr-comptes') || '{}');
            if(!bdd[pseudoCible.toLowerCase()]) return alert("Utilisateur introuvable !");
            
            bdd[pseudoCible.toLowerCase()].points = (bdd[pseudoCible.toLowerCase()].points || 0) + 50;
            localStorage.setItem('transfr-comptes', JSON.stringify(bdd));
            alert("🎁 50 points offerts à " + pseudoCible + " !");
        }

        // --- DÉMARRAGE ---
        window.onload = function() {
            const heureSauvee = localStorage.getItem('transfr-prochain-live') || "Bientôt le prochain live !";
            document.getElementById('affichage-heure-live').innerText = heureSauvee;
        };

        function ouvrirConnexion() { document.getElementById('zone-connexion').style.display = 'block'; }
        
        function verifierCode() {
            if(document.getElementById('code-secret').value === "1944") {
                document.getElementById('panneau-admin').style.display = 'block';
                document.getElementById('zone-connexion').style.display = 'none';
            } else { alert("Code incorrect !"); }
        }
    </script>
</body>
</html>
