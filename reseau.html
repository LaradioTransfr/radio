<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfr Social</title>
    <style>
        body {
            background-color: #0f0f0f; /* Noir YouTube */
            color: #ffffff;
            font-family: "Roboto", Arial, sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
        }

        /* BARRE DU HAUT */
        .yt-header {
            background-color: #0f0f0f; padding: 12px 20px;
            display: flex; align-items: center; justify-content: space-between;
            position: fixed; top: 0; width: 100%; box-sizing: border-box; z-index: 1000;
        }

        .yt-logo { font-weight: bold; font-size: 20px; display: flex; align-items: center; gap: 5px; }
        .yt-logo span { background-color: #00bcd4; color: #0f0f0f; padding: 2px 6px; border-radius: 4px; font-size: 13px; }

        .main-content { 
            margin-top: 60px; margin-bottom: 90px; padding: 15px; 
            display: flex; flex-direction: column; align-items: center;
            width: 100%; max-width: 450px; box-sizing: border-box;
        }

        /* BARRE DE NAVIGATION EN BAS */
        .yt-bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background-color: #0f0f0f; border-top: 1px solid #272727;
            display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000;
        }

        .nav-item {
            background: none; border: none; color: #aaa;
            display: flex; flex-direction: column; align-items: center;
            font-size: 10px; cursor: pointer; width: 20%;
        }
        .nav-item i { font-size: 20px; margin-bottom: 2px; }
        .nav-item.active { color: #00bcd4; font-weight: bold; }

        .page-section { width: 100%; display: none; }
        .page-section.active { display: block; }

        .card {
            background-color: #212121; border-radius: 14px; padding: 20px; 
            width: 100%; box-sizing: border-box; margin-bottom: 15px; border: 1px solid #2f2f2f;
        }

        input, textarea, select {
            width: 100%; background-color: #0f0f0f; border: 1px solid #3f3f3f; 
            border-radius: 8px; padding: 12px; color: white; box-sizing: border-box; 
            margin-bottom: 12px; outline: none; font-size: 14px;
        }

        .yt-btn {
            background-color: #00bcd4; color: #0f0f0f; border: none; border-radius: 20px; 
            padding: 12px; font-weight: bold; cursor: pointer; width: 100%; font-size: 14px;
        }

        .secondary-btn {
            background-color: #272727; color: white; border: 1px solid #3f3f3f; border-radius: 20px;
            padding: 8px 12px; font-size: 12px; cursor: pointer; margin-bottom: 15px; font-weight: bold;
        }

        /* STUDIO CAMÉRA */
        #cameraContainer { display: none; text-align: center; margin-top: 10px; }
        #webcam { width: 100%; max-width: 320px; height: auto; border-radius: 12px; border: 2px solid #00bcd4; background: black; }
        
        /* FILTRES CAMÉRA */
        .filter-cyberpunk { filter: hue-rotate(90deg) saturate(2); }
        .filter-astronaut { filter: contrast(1.5) brightness(1.2) sepia(0.2); }
        .filter-retro { filter: grayscale(1) contrast(1.2); }
        .filter-none { filter: none; }

        /* LOOK DES POSTS */
        .post { background-color: #212121; border-radius: 14px; padding: 15px; margin-bottom: 15px; border: 1px solid #2f2f2f; }
        .user-badge { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .avatar-circle { width: 36px; height: 36px; border-radius: 50%; background-color: #2f2f2f; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .video-wrapper { position: relative; padding-bottom: 177.77%; height: 0; margin-top: 10px; border-radius: 10px; overflow: hidden; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* POPUP PRIVACY */
        .privacy-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85); z-index: 2000; display: none; align-items: center; justify-content: center;
        }
        .privacy-box {
            background-color: #212121; border-radius: 16px; padding: 25px; width: 85%; max-width: 380px; text-align: center; border: 1px solid #3f3f3f;
        }
    </style>
</head>
<body>

    <div class="yt-header">
        <div class="yt-logo">🌐 TRANSFR <span>SOCIAL</span></div>
        <button onclick="window.location.href='index.html'" style="background:none; border:none; color:white; font-size:22px; cursor:pointer;">🏠</button>
    </div>

    <div class="main-content">

        <div id="pageAccueil" class="page-section active">
            <h3 style="margin-top: 0; font-size: 18px;">🏠 Fil d'actualité</h3>
            <div id="feedGeneral"></div>
        </div>

        <div id="pageShorts" class="page-section">
            <h3 style="margin-top: 0; font-size: 18px;">🩳 Flux des Shorts</h3>
            <div id="feedShortsOnly"></div>
        </div>

        <div id="pageCreer" class="page-section">
            <div id="createLocked" class="card" style="text-align: center;">
                <p>🔒 Tu dois posséder un compte pour publier ! Va sur l'onglet <strong>"Vous"</strong> en bas.</p>
            </div>
            
            <div id="createUnlocked" class="card" style="display: none;">
                <h3 style="margin-top:0; color:#00bcd4; text-align: center;">🎬 STUDIO CRÉATEUR</h3>
                
                <textarea id="postText" placeholder="Écris une description ou un message pour ton post..." rows="2"></textarea>
                
                <div style="border-top: 1px solid #333; padding-top: 10px; margin-top: 10px;">
                    <label style="font-size: 12px; color: #aaa; font-weight: bold;">Option A : Importer depuis YouTube</label>
                    <div id="youtubeLinksContainer">
                        <input type="text" class="video-input-link" placeholder="Colle le lien de ta vidéo ou Short YouTube...">
                    </div>
                    <button class="secondary-btn" onclick="ajouterNouvelInputVideo()">➕ Ajouter une autre vidéo</button>
                </div>

                <div style="border-top: 1px solid #333; padding-top: 10px;">
                    <label style="font-size: 12px; color: #aaa; font-weight: bold;">Option B : Enregistrer avec ta Caméra</label>
                    <button id="btnCamToggle" class="secondary-btn" style="display:block; width:100%; background-color:#2a2a2a; margin-top:5px;" onclick="demarrerCamera()">🎥 Allumer la caméra du studio</button>
                    
                    <div id="cameraContainer">
                        <video id="webcam" autoplay playsinline></video>
                        <label style="font-size: 12px; color: #aaa; display:block; margin: 8px 0 4px 0;">Choisis ton effet spécial :</label>
                        <select id="effectsSelect" onchange="appliquerEffetCamera()">
                            <option value="filter-none">❌ Aucun effet</option>
                            <option value="filter-cyberpunk">⚡ Filtre Néon Cyberpunk</option>
                            <option value="filter-astronaut">🚀 Ambiance Astronaute Space</option>
                            <option value="filter-retro">🎬 Mode Film Rétro</option>
                        </select>
                        <p style="font-size:11px; color:#ff4444;">✨ Effet actif appliqué sur ton écran !</p>
                    </div>
                </div>

                <button class="yt-btn" style="margin-top:15px; background-color:#ff0000; color:white;" onclick="publierStudio()">🚀 Mettre en ligne sur Transfr Social</button>
            </div>
        </div>

        <div id="pageVous" class="page-section">
            <div id="boxNotConnected" class="card">
                <h3 style="margin-top:0; color:#00bcd4;
