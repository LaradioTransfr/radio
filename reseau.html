<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfr Social</title>
    <style>
        body {
            background-color: #0f0f0f; /* Noir YouTube */
            color: #ffffff;
            font-family: "Roboto", Arial, sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
        }

        /* BARRE DU HAUT */
        .yt-header {
            background-color: #0f0f0f; padding: 12px 20px;
            display: flex; align-items: center; justify-content: space-between;
            position: fixed; top: 0; width: 100%; box-sizing: border-box; z-index: 1000;
        }

        .yt-logo { font-weight: bold; font-size: 20px; display: flex; align-items: center; gap: 5px; }
        .yt-logo span { background-color: #00bcd4; color: #0f0f0f; padding: 2px 6px; border-radius: 4px; font-size: 13px; }

        .main-content { 
            margin-top: 60px; margin-bottom: 90px; padding: 15px; 
            display: flex; flex-direction: column; align-items: center;
            width: 100%; max-width: 450px; box-sizing: border-box;
        }

        /* BARRE DE NAVIGATION EN BAS */
        .yt-bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background-color: #0f0f0f; border-top: 1px solid #272727;
            display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000;
        }

        .nav-item {
            background: none; border: none; color: #aaa;
            display: flex; flex-direction: column; align-items: center;
            font-size: 10px; cursor: pointer; width: 20%;
            outline: none;
        }
        .nav-item i { font-size: 20px; margin-bottom: 2px; font-style: normal; }
        .nav-item.active { color: #00bcd4; font-weight: bold; }

        .page-section { width: 100%; display: none; }
        .page-section.active { display: block; }

        .card {
            background-color: #212121; border-radius: 14px; padding: 20px; 
            width: 100%; box-sizing: border-box; margin-bottom: 15px; border: 1px solid #2f2f2f;
        }

        input, textarea, select {
            width: 100%; background-color: #0f0f0f; border: 1px solid #3f3f3f; 
            border-radius: 8px; padding: 12px; color: white; box-sizing: border-box; 
            margin-bottom: 12px; outline: none; font-size: 14px;
        }

        .yt-btn {
            background-color: #00bcd4; color: #0f0f0f; border: none; border-radius: 20px; 
            padding: 12px; font-weight: bold; cursor: pointer; width: 100%; font-size: 14px;
        }

        .secondary-btn {
            background-color: #272727; color: white; border: 1px solid #3f3f3f; border-radius: 20px;
            padding: 8px 12px; font-size: 12px; cursor: pointer; margin-bottom: 15px; font-weight: bold;
        }

        /* BOUTONS CHOIX INSCRIPTION / CONNEXION */
        .auth-toggle-container {
            display: flex; gap: 10px; margin-bottom: 15px; width: 100%;
        }
        .auth-toggle-btn {
            flex: 1; padding: 10px; background-color: #272727; color: white; border: 1px solid #3f3f3f;
            border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px;
        }
        .auth-toggle-btn.active {
            background-color: #00bcd4; color: #0f0f0f; border: none;
        }

        /* ENREGISTREUR WEB CAM */
        #cameraContainer { display: none; text-align: center; margin-top: 10px; }
        #webcam { width: 100%; max-width: 320px; height: auto; border-radius: 12px; border: 2px solid #00bcd4; background: black; }
        .filter-cyberpunk { filter: hue-rotate(90deg) saturate(2); }
        .filter-astronaut { filter: contrast(1.5) brightness(1.2) sepia(0.2); }
        .filter-retro { filter: grayscale(1) contrast(1.2); }
        .filter-none { filter: none; }

        /* INTERFACE STRÉAMING LIVE MODERNE */
        #liveStreamContainer { display: none; background-color: black; border-radius: 12px; overflow: hidden; position: relative; border: 2px solid #ff0000; margin-top: 10px; }
        #liveWebcam { width: 100%; height: auto; display: block; }
        .live-overlay-top { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
        .live-badge { background-color: #ff0000; color: white; font-weight: bold; padding: 4px 10px; border-radius: 4px; font-size: 11px; text-transform: uppercase; animation: blinker 1.5s linear infinite; }
        .live-viewers { background-color: rgba(0,0,0,0.75); color: #ff3333; font-weight: bold; padding: 4px 10px; border-radius: 4px; font-size: 11px; border: 1px solid #ff0000; }
        
        /* TCHAT DU LIVE */
        .live-chat-box { background-color: rgba(15,15,15,0.85); height: 110px; position: absolute; bottom: 0; left: 0; width: 100%; overflow-y: auto; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px; font-size: 12px; text-align: left; }
        .chat-msg { margin: 0; line-height: 1.3; }
        .chat-user { color: #00bcd4; font-weight: bold; }

        @keyframes blinker { 50% { opacity: 0; } }

        /* LOOK DES POSTS */
        .post { background-color: #212121; border-radius: 14px; padding: 15px; margin-bottom: 15px; border: 1px solid #2f2f2f; }
        .user-badge { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .avatar-circle { width: 36px; height: 36px; border-radius: 50%; background-color: #2f2f2f; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .video-wrapper { position: relative; padding-bottom: 177.77%; height: 0; margin-top: 10px; border-radius: 10px; overflow: hidden; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* POPUP PRIVACY */
        .privacy-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .privacy-box { background-color: #212121; border-radius: 16px; padding: 25px; width: 85%; max-width: 380px; text-align: center; border: 1px solid #3f3f3f; }
    </style>
</head>
